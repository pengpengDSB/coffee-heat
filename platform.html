<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>杯记 · 平台运营</title>
<style>
:root{
  --ink:#17110c; --ink2:#241a13; --paper:#f7f2e9; --card:#fffdf8;
  --line:#e4dbcb; --muted:#8a7a68; --accent:#b4703a; --accent2:#8c5227;
  --ok:#2f7d54; --warn:#b8891e; --bad:#b24a3f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#f3d9b6;
  display:grid;place-items:center;font-weight:700;letter-spacing:.5px}
.top h1{font-size:19px;letter-spacing:.5px}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top .sp{flex:1}
.ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;
  font-size:13px;color:var(--muted);cursor:pointer}
.ghost:hover{color:var(--ink);border-color:#cfc4b2}

/* 登录 */
.gate{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:28px 26px;box-shadow:0 18px 40px rgba(23,17,12,.06)}
.gate h2{font-size:17px;margin-bottom:6px}
.gate p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;background:#fff;outline:none}
.field input:focus{border-color:var(--accent)}
.btn{background:var(--ink);color:#f4e3c9;border:0;border-radius:10px;padding:12px 16px;
  font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn:hover{background:var(--ink2)}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:4px 0 8px}

/* 主体 */
.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:22px;letter-spacing:.5px}
.stat span{font-size:12px;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end}
.mini label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.mini input,.mini select{width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:9px;font-size:13px;background:#fff}
.mini .hint{font-size:11px;color:var(--muted);margin-top:4px}
.panel .act{display:flex;align-items:center;gap:10px}
.primary{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 16px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.primary:hover{background:var(--accent2)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;line-height:1.6}
.pill.active{background:#e7f2ea;color:var(--ok)}
.pill.pending{background:#f6efdd;color:var(--warn)}
.pill.suspended{background:#f7e6e3;color:var(--bad)}
.tiny{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;
  font-size:12px;cursor:pointer;color:var(--muted);margin-right:6px}
.tiny:hover{color:var(--ink);border-color:#cdc0ac}
.tiny.danger:hover{color:var(--bad);border-color:#dfb9b3}
.empty{color:var(--muted);font-size:13px;padding:18px 0}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:#f6e7cf;padding:11px 18px;border-radius:999px;font-size:13px;
  transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr 1fr;gap:12px}
  .row .primary{grid-column:1/-1}
  table{font-size:12px}
  th:nth-child(4),td:nth-child(4){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">杯</div>
    <div>
      <h1>杯记 · 平台运营</h1>
      <div class="sub">Merchant Console — 开号、停用、到期，一处管</div>
    </div>
    <div class="sp"></div>
    <button class="ghost hidden" id="logoutBtn">退出</button>
  </div>

  <!-- 登录 -->
  <div id="gate" class="gate">
    <h2>平台超管登录</h2>
    <p>这一页是给平台方（你）用的，商户看不到。口令与商户后台口令是两套。</p>
    <div class="field"><label for="mp">超管口令</label>
      <input id="mp" type="password" placeholder="平台口令" autocomplete="off"></div>
    <div class="err" id="gErr"></div>
    <button class="btn" id="gBtn">进入</button>
  </div>

  <!-- 主体 -->
  <div id="main" class="hidden">
    <div class="stats">
      <div class="stat"><b id="sTenants">–</b><span>商户总数</span></div>
      <div class="stat"><b id="sActive">–</b><span>在用</span></div>
      <div class="stat"><b id="sOrders">–</b><span>累计订单</span></div>
      <div class="stat"><b id="sProducts">–</b><span>在售饮品</span></div>
    </div>

    <div class="panel">
      <h3>开一个新商户</h3>
      <div class="row">
        <div class="mini"><label>商户编码</label><input id="nId" placeholder="bj02" maxlength="12">
          <div class="hint">小写字母/数字，2–12 位，会进顾客链接 ?t=</div></div>
        <div class="mini"><label>店名</label><input id="nName" placeholder="杯记 · 新店"></div>
        <div class="mini"><label>登录口令</label><input id="nPass" placeholder="至少 6 位"></div>
        <div class="mini"><label>菜单模板</label>
          <select id="nTpl"><option value="bj01">从 bj01 复制（推荐）</option><option value="">空白后台</option></select></div>
        <button class="primary" id="nBtn">开号</button>
      </div>
      <div class="foot">开号后对方登录：<b>商户后台 → 商户编码 + 口令</b>；顾客端链接：<b>index.html?t=编码</b>。模板会连同配方、配料、成本、豆价一起复制。</div>
    </div>

    <div class="panel">
      <h3>商户列表</h3>
      <div id="list"><div class="empty">正在读取…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var SUPA = {url:"https://pnucsuxkduvwpgklizmw.supabase.co",
    anonKey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBudWNzdXhrZHV2d3Bna2xpem13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0ODI0MjEsImV4cCI6MjExMTA1ODQyMX0.8H2mNE3KEXZmHdXpV92pJ80OeN_gKAGvVZ69l0zwBGw"};
  var MP_KEY="cafe_master_v1";
  var master="", tenants=[];

  function el(id){ return document.getElementById(id); }
  function toast(t){ var e=el("toast"); e.textContent=t; e.classList.add("on");
    clearTimeout(toast._t); toast._t=setTimeout(function(){ e.classList.remove("on"); },2200); }
  function save(){ try{ sessionStorage.setItem(MP_KEY, master); }catch(e){} }
  function load(){ try{ return sessionStorage.getItem(MP_KEY)||""; }catch(e){ return ""; } }

  async function rpc(fn, body){
    var r = await fetch(SUPA.url+"/rest/v1/rpc/"+fn, {
      method:"POST", cache:"no-store",
      headers:{"Content-Type":"application/json", apikey:SUPA.anonKey, Authorization:"Bearer "+SUPA.anonKey},
      body: JSON.stringify(body||{})
    });
    var txt = await r.text();
    var data = null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
    if(!r.ok){
      var msg = (data && (data.message||data.hint)) || txt || ("HTTP "+r.status);
      throw new Error(msg);
    }
    return data;
  }

  function fmtDate(s){ if(!s) return "—"; var d=new Date(s); if(isNaN(d)) return "—";
    return (d.getMonth()+1)+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
  function fmtDay(s){ if(!s) return "未设置"; var d=new Date(s); if(isNaN(d)) return "未设置";
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  function renderList(){
    var box = el("list");
    if(!tenants.length){ box.innerHTML='<div class="empty">还没有商户。上面开第一个。</div>'; return; }
    var rows = tenants.map(function(t){
      var pill = '<span class="pill '+t.status+'">'+(t.status==="active"?"在用":t.status==="suspended"?"已停用":"待审")+'</span>';
      var exp = t.expire_at ? fmtDay(t.expire_at) : "未设置";
      var overdue = t.expire_at && new Date(t.expire_at) < new Date();
      return '<tr data-id="'+t.id+'">'+
        '<td class="code">'+t.id+'</td>'+
        '<td>'+ (t.name||"") +'</td>'+
        '<td>'+ pill +'</td>'+
        '<td>'+ t.products +' 品 / '+ t.orders +' 单 / '+ t.customers +' 客</td>'+
        '<td'+(overdue?' style="color:#b24a3f"':'')+'>'+ exp +'</td>'+
        '<td>'+
          '<button class="tiny" data-act="toggle">'+(t.status==="active"?"停用":"启用")+'</button>'+
          '<button class="tiny" data-act="expire">+30天</button>'+
          '<button class="tiny" data-act="rename">改名</button>'+
          '<button class="tiny danger" data-act="pass">改口令</button>'+
        '</td></tr>';
    }).join("");
    box.innerHTML = '<table><thead><tr><th>编码</th><th>店名</th><th>状态</th><th>规模</th><th>到期</th><th>操作</th></tr></thead><tbody>'+rows+'</tbody></table>';
    Array.prototype.forEach.call(box.querySelectorAll("button[data-act]"), function(b){
      b.addEventListener("click", function(){ act(b.parentNode.parentNode.getAttribute("data-id"), b.getAttribute("data-act")); });
    });
  }

  async function act(id, what){
    var t = tenants.filter(function(x){ return x.id===id; })[0]; if(!t) return;
    try{
      if(what==="toggle"){
        await rpc("t_platform_update_tenant", {p_master:master, p_id:id, p_status: t.status==="active"?"suspended":"active"});
        toast(t.status==="active" ? "已停用 "+id : "已启用 "+id);
      }else if(what==="expire"){
        var base = t.expire_at && new Date(t.expire_at) > new Date() ? new Date(t.expire_at) : new Date();
        base.setDate(base.getDate()+30);
        await rpc("t_platform_update_tenant", {p_master:master, p_id:id, p_expire: base.toISOString()});
        toast("已续 30 天："+fmtDay(base.toISOString()));
      }else if(what==="rename"){
        var n = prompt("新的店名：", t.name||"");
        if(!n) return;
        await rpc("t_platform_update_tenant", {p_master:master, p_id:id, p_name:n});
        toast("店名已改");
      }else if(what==="pass"){
        var p = prompt("给 "+id+" 设新口令（至少 6 位）：","");
        if(!p) return;
        if(String(p).length < 6){ toast("太短了，至少 6 位"); return; }
        await rpc("t_platform_update_tenant", {p_master:master, p_id:id, p_pass:p});
        toast("口令已更新，记得告诉对方");
      }
      await refresh();
    }catch(e){ toast("失败："+((e&&e.message)||e)); }
  }

  async function refresh(){
    tenants = (await rpc("t_platform_list_tenants", {p_master:master})) || [];
    var act = tenants.filter(function(t){ return t.status==="active"; }).length;
    var orders = tenants.reduce(function(a,t){ return a+(t.orders||0); },0);
    var prods = tenants.reduce(function(a,t){ return a+(t.products||0); },0);
    el("sTenants").textContent = tenants.length;
    el("sActive").textContent = act;
    el("sOrders").textContent = orders;
    el("sProducts").textContent = prods;
    if(el("nTpl")){
      el("nTpl").innerHTML = tenants.map(function(t){
        return '<option value="'+t.id+'">从 '+t.id+'（'+(t.name||"")+'）复制</option>';
      }).join("") + '<option value="">空白后台</option>';
      if(tenants.filter(function(t){return t.id==="bj01";}).length) el("nTpl").value="bj01";
    }
    renderList();
  }

  async function createTenant(){
    var id=(el("nId").value||"").trim().toLowerCase();
    var name=(el("nName").value||"").trim();
    var pass=(el("nPass").value||"").trim();
    var tpl=el("nTpl").value;
    if(!/^[a-z0-9][a-z0-9_-]{1,11}$/.test(id)){ toast("商户编码格式不对：小写字母/数字/下划线/中划线，2–12 位"); return; }
    if(!name){ toast("给个店名"); return; }
    if(pass.length<6){ toast("口令至少 6 位"); return; }
    el("nBtn").disabled=true;
    try{
      var r = await rpc("t_platform_create_tenant", {p_master:master, p_id:id, p_name:name, p_pass:pass, p_template: tpl||null});
      toast("已开号 "+id+"，菜单 "+(r&&r.products||0)+" 款；顾客链接 index.html?t="+id);
      el("nId").value=""; el("nName").value=""; el("nPass").value="";
      await refresh();
    }catch(e){ toast("开号失败："+((e&&e.message)||e)); }
    el("nBtn").disabled=false;
  }

  async function enter(){
    var p=(el("mp").value||"").trim();
    if(!p){ el("gErr").textContent="请输入平台口令"; return; }
    el("gBtn").disabled=true;
    try{
      await rpc("t_platform_list_tenants", {p_master:p});
      master=p; save();
      el("gate").classList.add("hidden"); el("main").classList.remove("hidden");
      el("logoutBtn").classList.remove("hidden");
      await refresh();
    }catch(e){
      el("gErr").textContent = /42501|口令|permission/i.test(e.message) ? "平台口令不对" : ("读取失败："+e.message);
      el("gBtn").disabled=false;
    }
  }

  el("gBtn").addEventListener("click", enter);
  el("mp").addEventListener("keydown", function(e){ if(e.key==="Enter") enter(); });
  el("logoutBtn").addEventListener("click", function(){
    master=""; try{ sessionStorage.removeItem(MP_KEY); }catch(e){}
    el("main").classList.add("hidden"); el("gate").classList.remove("hidden");
    el("logoutBtn").classList.add("hidden"); el("mp").value="";
  });
  el("nBtn").addEventListener("click", createTenant);

  /* 自动续用本会话口令 */
  window.addEventListener("DOMContentLoaded", function(){
    var saved=load();
    if(saved){ el("mp").value=saved; enter(); }
    else { el("mp").focus(); }
  });
})();
</script>
</body>
</html>
