<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杯记 · 一杯的配方、热量与成本</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
  :root{
    --paper:#FCFCFA; --paper-2:#F4F3EF; --card:#FFFFFF; --card-2:#FAF9F5;
    --ink:#141410; --ink-soft:#6E6C63; --ink-faint:#8C8A80;
    --line:#E2DFD4; --line-strong:#D5D2C7;
    --espresso:#181510; --espresso-2:#0F0D0A; --cream:#F4F1E9;
    --gold:#7A4E33; --gold-soft:#EFE7DE; --caramel:#7A4E33;
    --accent:#7A4E33; --accent-soft:#F1EBE4;
    --low:#3F6B52; --low-bg:#EDF2EE;
    --mid:#8A6A2F; --mid-bg:#F5EFE3;
    --high:#9C4A38; --high-bg:#F7E9E5;
    --radius:6px; --radius-sm:4px;
    --shadow:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#F0EFEB;color:var(--ink);line-height:1.6;padding-bottom:56px;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;width:100%;margin:0 auto;padding:0 24px}
  .num,.prod-kcal,.ing-kcal,.total-bar .big,.ordno{font-family:"Archivo","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:20;background:var(--espresso);border-bottom:1px solid var(--espresso-2)}
  .topbar-in{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:13px 0}
  .brand{font-weight:500;color:var(--cream);font-size:13px;letter-spacing:.22em;display:flex;align-items:center;gap:10px}
  .brand::before{content:"";width:3px;height:15px;background:#8C6A4E;display:inline-block;flex:none}
  .brand-sub{font-size:10.5px;letter-spacing:.1em;opacity:.62;font-weight:400}
  .view-switch{display:flex;gap:20px;background:none;padding:0;margin-left:auto}
  .view-switch button{
    border:none;background:none;color:rgba(244,241,233,.55);font:inherit;font-size:11.5px;letter-spacing:.14em;
    padding:6px 0 5px;cursor:pointer;white-space:nowrap;border-bottom:1px solid transparent;
  }
  .view-switch button.active{background:none;color:var(--cream);font-weight:400;border-bottom:1px solid var(--cream);box-shadow:none}
  /* 顶栏跟随所在表面：落在纸白页面上时转浅色 */
  .topbar.light{background:var(--paper);border-bottom:1px solid var(--line)}
  .topbar.light .brand{color:var(--ink);font-weight:500}
  .topbar.light .brand::before{background:var(--gold)}
  .topbar.light .view-switch button{color:var(--ink-faint)}
  .topbar.light .view-switch button.active{color:var(--ink);border-bottom-color:var(--gold)}

  h1.page-title{font-weight:400;color:var(--ink);font-size:21px;margin:30px 0 6px;letter-spacing:.06em}
  .page-sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:22px;max-width:64ch;letter-spacing:.02em;line-height:1.9}

  /* ===== 通用卡片/控件 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .ic{width:1em;height:1em;flex:none}
  .thumb-ic{display:flex;align-items:center;justify-content:center;background:var(--gold-soft)!important;color:var(--gold);flex:none}
  .thumb-ic.mono{font-family:"Noto Sans SC",sans-serif;font-size:15px;color:#7A4E33;letter-spacing:0;line-height:1}
  .thumb-ic .ic{width:46%;height:46%}
  .card h2{font-weight:500;font-size:14px;color:var(--ink);margin-bottom:5px;letter-spacing:.1em}
  .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;letter-spacing:.02em}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
  .chip{
    border:1px solid var(--line);background:none;color:var(--ink-soft);
    font:inherit;font-size:11.5px;padding:8px 13px;border-radius:0;cursor:pointer;letter-spacing:.06em;
  }
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:7px;font-weight:400;letter-spacing:.1em}
  .field input,.field select,.field textarea{
    width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--card-2);font:inherit;color:var(--ink);font-size:14px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:1px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{padding:12px 18px;border:none;border-radius:var(--radius-sm);background:var(--ink);color:#fff;font:inherit;font-weight:400;font-size:12.5px;letter-spacing:.12em;cursor:pointer}
  .btn:active{opacity:.86}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-strong)}
  .btn.sm{padding:7px 12px;font-size:11px;border-radius:2px;letter-spacing:.06em}
  .btn.danger{background:none;color:var(--high);border:1px solid #DCC3BB}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .toolbar{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}
  .search{flex:1;min-width:160px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card-2);font:inherit;color:var(--ink);font-size:13px}
  .search:focus{outline:1px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .ghost-btn{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer;padding:8px 10px;border-radius:2px;white-space:nowrap;letter-spacing:.08em}
  .ghost-btn:hover{background:var(--paper-2);color:var(--ink)}
  .check-list{display:flex;flex-direction:column;gap:9px}
  .check-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;cursor:pointer}
  .check-row input{width:15px;height:15px;accent-color:var(--ink)}
  .qty-chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px}
  .qty-chip{border:1px solid var(--line);background:none;color:var(--ink-soft);font:inherit;font-size:11px;padding:5px 10px;border-radius:2px;cursor:pointer;letter-spacing:.04em}
  .qty-chip:active{background:var(--paper-2)}

  /* ===== 后台布局 ===== */
  .admin-tabs{display:flex;gap:24px;margin:4px 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
  .admin-tabs button{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:12.5px;letter-spacing:.1em;
    padding:6px 0 12px;cursor:pointer;border-bottom:2px solid transparent}
  .admin-tabs button.active{background:none;color:var(--ink);font-weight:500;border-bottom:2px solid var(--ink)}

  .grid{display:grid;gap:16px}
  @media(min-width:820px){ .grid.two{grid-template-columns:1fr 1fr} }

  /* 配料表 */
  .ing-table{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .ing-row{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;display:flex;gap:14px;background:none}
  .ing-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ing-name{font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.04em}
  .ing-cat{font-size:10.5px;color:var(--ink-faint);margin-left:9px;font-weight:400;letter-spacing:.06em}
  .ing-meta{margin-top:7px;font-size:11.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 16px;letter-spacing:.02em}
  /* 豆价计算 · 询比价 */
  .bean-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .bkpi{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card)}
  .bkpi .k{font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint)}
  .bkpi .v{font-size:21px;line-height:1.25;margin-top:7px;font-variant-numeric:tabular-nums}
  .bkpi .v small{font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:2px}
  .bkpi .m{font-size:10.5px;color:var(--ink-faint);margin-top:6px;line-height:1.45;min-height:15px}
  .bkpi.low .v{color:#3F6B52}
  .bkpi.high .v{color:#9C4A38}
  .bkpi.spread .v{color:var(--ink)}
  .bkpi.na .v{color:var(--ink-faint)}
  .bean-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin-bottom:14px}
  .bean-chips{display:flex;gap:6px;flex-wrap:wrap}
  .bean-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:11.5px;color:var(--ink-soft);cursor:pointer;letter-spacing:.02em;transition:background .15s,color .15s,border-color .15s}
  .bean-chip:hover{color:var(--ink);border-color:var(--line-strong)}
  .bean-chip.on{background:var(--ink);color:#f6e7cf;border-color:var(--ink)}
  .bean-chip .n{opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
  .bean-spacer{margin-left:auto;display:flex;gap:8px;align-items:center}
  .bean-sort{font:inherit;font-size:11.5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink-soft)}
  .bean-chan{display:flex;gap:8px 26px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:14px}
  .bean-chan span b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
  .bean-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bean-tbl{width:100%;min-width:1110px;border-collapse:collapse;font-size:12px;letter-spacing:.01em}
  .bean-tbl th{font-size:10.5px;font-weight:500;color:var(--ink-faint);letter-spacing:.08em;text-align:center;padding:0 6px 9px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
  .bean-tbl td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
  .bean-tbl input,.bean-tbl select{width:100%;box-sizing:border-box;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card-2);font:inherit;font-size:12px;text-align:center;color:var(--ink)}
  .bean-tbl input[type="text"]{text-align:left}
  .bean-tbl input:focus,.bean-tbl select:focus{outline:none;border-color:var(--line-strong);background:var(--card)}
  .bean-tbl td.rk{width:34px;font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink-faint)}
  .bean-tbl td.kg{white-space:nowrap;font-variant-numeric:tabular-nums}
  .bean-tbl td.kg b{font-size:14.5px;color:var(--gold);font-weight:500}
  .bean-tbl td.kg i{font-size:9.5px;color:var(--ink-faint);font-style:normal;margin-left:1px}
  .bean-tbl td.cup{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .bean-tbl td.cup b{color:var(--ink);font-weight:500}
  .bean-wr{display:grid;grid-template-columns:1fr auto;gap:5px 6px;align-items:center;min-width:188px}
  .bean-wr select{font:inherit;font-size:11px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card-2);text-align:left;width:100%;box-sizing:border-box}
  .bean-wr .btn{padding:5px 9px;font-size:11px;white-space:nowrap}
  .beam-cur{grid-column:1/-1;font-size:10px;color:var(--ink-faint);text-align:left;line-height:1.45;font-variant-numeric:tabular-nums}
  .bean-tbl td.cups{font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
  .bean-tbl tr.best td{background:rgba(198,148,72,.09)}
  .bean-tbl tr.best td.kg b{color:#8a5a1f}
  .bean-tbl td.kg em{font-style:normal;font-size:9.5px;color:#9C4A38;opacity:.85;margin-left:4px}
  .bean-best{display:inline-block;font-size:9px;padding:2px 5px;border-radius:4px;background:var(--gold);color:#fff;margin-left:5px;letter-spacing:.06em;vertical-align:1px}
  .bean-tbl tr.pending td.kg,.bean-tbl tr.pending td.cup,.bean-tbl tr.pending td.cups{color:var(--ink-faint)}
  .bean-tbl .pend{font-size:10.5px;color:var(--ink-faint)}
  .bean-hint{font-size:11px;color:var(--ink-faint);text-align:left;margin-top:12px;line-height:1.9}
  .bean-empty{border:1px dashed var(--line);border-radius:10px;padding:26px 20px;text-align:center;font-size:12px;color:var(--ink-faint)}
  .bean-note{font-size:11.5px;color:var(--ink-faint);margin-bottom:12px}
  .ing-kcal{font-weight:400;color:var(--gold);font-size:13px}
  .ing-ops{display:flex;gap:4px;margin-top:10px}
  .ing-ops .btn{background:none;border:none;padding:5px 8px;font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em}
  .ing-ops .btn:hover{color:var(--ink);background:var(--paper-2)}
  .ing-ops .btn.danger{color:#A8635A;border:none;background:none}
  .ing-ops .btn.danger:hover{color:#8E4436;background:#F7EDEA}
  .ing-thumb{width:46px;height:46px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .ing-body{flex:1;min-width:0}

  /* 产品卡片 */
  .prod-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .prod{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0;display:flex;gap:14px}
  .prod-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .prod-name{font-weight:400;font-size:14.5px;color:var(--ink);letter-spacing:.05em}
  .prod-cat{font-size:10.5px;color:var(--ink-faint);margin-left:9px;font-weight:400;letter-spacing:.06em}
  .prod-kcal{font-weight:400;font-size:19px;color:var(--ink);white-space:nowrap}
  .prod-kcal small{font-size:10.5px;color:var(--ink-soft);font-weight:400;letter-spacing:.1em}
  .prod-meta{margin-top:7px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:0;font-weight:400;letter-spacing:.08em}
  .tag.low{background:var(--low-bg);color:var(--low)}
  .tag.mid{background:var(--mid-bg);color:var(--mid)}
  .tag.high{background:var(--high-bg);color:var(--high)}

  /* ===== C 端预览 ===== */
  .shop-grid{display:grid;gap:0;border-top:1px solid var(--line)}
  @media(min-width:820px){ .shop-grid{grid-template-columns:1fr 1fr;column-gap:44px} }
  .shop-card{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;cursor:pointer;display:flex;gap:14px}
  .shop-card:hover{border-color:var(--line);transform:none}
  .shop-card:active{background:var(--paper-2)}
  .shop-card .prod-kcal{font-size:22px}
  .shop-meta{margin-top:8px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .price{font-weight:400;color:var(--ink);font-size:14px;font-family:"Archivo",sans-serif}

  /* 饮品图片 */
  .prod-thumb{width:54px;height:54px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .prod-body{flex:1;min-width:0}
  .shop-card .prod-body{overflow:hidden}
  .shop-thumb{width:70px;height:70px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .shop-card .prod-top,.shop-card .shop-meta{min-width:0}
  .detail-img{width:100%;height:170px;object-fit:cover;border-radius:2px;margin-bottom:16px;background:var(--paper-2)}
  .detail-img.thumb-ic .ic{width:56px;height:56px}
  .img-uploader{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .img-preview{width:82px;height:82px;border-radius:2px;object-fit:cover;background:var(--paper-2);border:1px solid var(--line);flex:none}
  .img-ops{display:flex;flex-direction:column;gap:8px}
  .img-hint{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em}

  .detail-head{display:flex;align-items:center;gap:10px;margin:20px 0}
  .back{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11.5px;cursor:pointer;padding:6px 4px;letter-spacing:.1em}
  .detail-card{margin-top:8px}
  .milk-switch{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}

  .split-list{display:flex;flex-direction:column;gap:0;margin-top:14px;border-top:1px solid var(--line-strong)}
  .split-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px solid var(--line-2);padding:11px 0}
  .split-row:last-child{border-bottom:none}
  .split-row .s-left{display:flex;gap:10px;align-items:center;min-width:0}
  .s-thumb{width:34px;height:34px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .split-row .s-name{color:var(--ink);letter-spacing:.03em}
  .split-row .s-meta{color:var(--ink-soft);font-size:11px}
  .split-row .s-kcal{font-weight:400;color:var(--gold);white-space:nowrap;font-family:"Archivo",sans-serif}
  .split-row .s-pct{font-weight:400;font-size:10px;color:var(--ink-soft)}
  .total-bar{margin-top:18px;background:var(--espresso);color:var(--cream);border-radius:2px;padding:18px 20px;display:flex;justify-content:space-between;align-items:baseline}
  .total-bar .big{font-weight:300;font-size:30px;letter-spacing:-.01em}
  .total-bar small{color:rgba(244,241,233,.6);letter-spacing:.12em;font-size:10px}

  /* ===== 弹层 ===== */
  .overlay{position:fixed;inset:0;background:rgba(20,20,16,.45);z-index:30;display:none;padding:18px;overflow-y:auto}
  .overlay.open{display:block}
  .modal{background:var(--paper);border-radius:2px;max-width:560px;margin:24px auto;padding:26px 26px 0}
  .modal h2{font-weight:500;color:var(--ink);margin-bottom:16px;padding-bottom:14px;font-size:15px;letter-spacing:.12em;border-bottom:1px solid var(--line)}
  .modal .btn-row{position:sticky;bottom:0;background:var(--paper);padding:16px 0 18px;margin-top:22px;border-top:1px solid var(--line);z-index:2;box-shadow:0 -12px 16px -14px rgba(20,20,16,.28)}
  .modal .ing-row-edit .field{margin-bottom:0}
  .ing-row-edit{border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:10px;background:var(--card-2)}
  .ing-row-edit .row2{align-items:end}

  .note{margin-top:26px;font-size:10.5px;color:var(--ink-soft);line-height:2;max-width:66ch;letter-spacing:.02em}
  .note b{color:var(--ink);font-weight:500}
  .empty{color:var(--ink-faint);font-size:12.5px;padding:44px 0;text-align:center;letter-spacing:.06em}

  /* ===== 订单看板 ===== */
  .legend{display:flex;justify-content:flex-end;font-size:10px;color:var(--ink-faint);letter-spacing:.08em;padding:2px 0 8px}
  .mockbar{background:#F4EEE6;border:1px solid #E4D6C6;color:#7A4E33;font-size:10.5px;letter-spacing:.08em;padding:8px 12px;margin-bottom:16px}
  .ordbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
  .ordbar .cnt{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
  .ordbar .cnt b{font-family:"Archivo",sans-serif;font-size:20px;font-weight:400;color:var(--ink);margin-right:5px}
  .ordlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .ord{border-bottom:1px solid var(--line);padding:18px 0}
  .ord.wait{background:linear-gradient(90deg,rgba(122,78,51,.05),rgba(122,78,51,0) 60%)}
  .ord-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .ordno{font-size:26px;font-weight:400;letter-spacing:.06em;line-height:1.1}
  .ord-time{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}
  .ord-items{margin-top:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.9}
  .ord-items b{color:var(--ink);font-weight:400}
  .ord-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .ord-sum{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em}
  .ord-sum b{font-family:"Archivo",sans-serif;font-size:15px;color:var(--ink);font-weight:400}
  .ord-ops{display:flex;gap:8px;flex-wrap:wrap}
  .st{display:inline-block;font-size:10px;padding:3px 9px;letter-spacing:.1em;border-radius:0}
  .st.wait{background:#F2E6DB;color:#7A4E33}
  .st.make{background:#EDF2EE;color:#3F6B52}
  .st.done{background:var(--paper-2);color:var(--ink-soft)}
  .st.void{background:#F7E9E5;color:#9C4A38}
  .ord-note{margin-top:8px;font-size:11px;color:var(--gold);letter-spacing:.02em}

  /* ===== 品牌落地页 ===== */
  /* ===== Hero 三套模板（A 暗场实拍 / B 纸白线描 / C 双栏俯拍） ===== */
  :root{--hero-gut:max(24px,calc((100vw - 1200px)/2 + 24px))}
  .hero{position:relative;overflow:hidden}
  .hero-kicker{font-size:10px;letter-spacing:.28em;font-weight:400;margin:0 0 24px}
  .hero h2{font-weight:300;letter-spacing:.02em;margin:0 0 20px}
  .hero h2 em{font-style:normal}
  .hero p{margin:0;letter-spacing:.03em}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
  .hero-actions .btn{padding:13px 22px;letter-spacing:.14em;font-size:12px}

  /* ---- A：暗场实拍 ---- */
  .hero-A{background:#14110E;color:var(--cream);height:max(600px,calc(100vh - 57px))}
  .hero-A .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 50%;z-index:0}
  .hero-A .hero-shade{position:absolute;inset:0;z-index:1;background:
    linear-gradient(90deg,rgba(11,9,7,.94) 0%,rgba(11,9,7,.82) 26%,rgba(11,9,7,.50) 54%,rgba(11,9,7,.24) 78%,rgba(11,9,7,.34) 100%),
    linear-gradient(180deg,rgba(11,9,7,.28) 0%,rgba(11,9,7,0) 34%,rgba(11,9,7,.48) 100%)}
  .hero-A .hero-in{position:relative;z-index:2;padding:0 24px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
  .hero-A .hero-text{margin:auto 0;padding:clamp(24px,5vh,72px) 0 clamp(12px,1.6vh,28px);max-width:640px}
  .hero-A .hero-kicker{color:rgba(244,241,233,.62)}
  .hero-A h2{font-size:clamp(32px,3.5vw,54px);line-height:1.15;color:#FCFCFA}
  .hero-A h2 em{color:#D8BD9E}
  .hero-A p{color:rgba(244,241,233,.68);max-width:44ch;font-size:13.5px;line-height:2.05}
  .hero-A .hero-actions .btn{background:#FCFCFA;color:#14110E;border:1px solid #FCFCFA}
  .hero-A .hero-actions .btn.ghost{background:rgba(252,252,250,.04);border:1px solid rgba(244,241,233,.34);color:rgba(244,241,233,.92)}
  .hero-A .hero-stats{position:absolute;right:24px;top:50%;transform:translateY(-50%);text-align:right}
  .hero-A .hero-stats .hs{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;margin-bottom:14px}
  .hero-A .hero-stats .hs b{font-size:28px;font-weight:300;color:#FCFCFA;font-family:"Archivo",sans-serif;line-height:1}
  .hero-A .hero-stats .hs span{font-size:10px;color:rgba(244,241,233,.5);letter-spacing:.16em}
  .hero-A .hero-scale{position:relative;width:min(780px,100%);height:52px;margin:0 0 clamp(30px,6.2vh,72px)}
  .hero-A .hero-scale .rail{position:absolute;left:0;right:0;bottom:24px;height:1px;background:rgba(244,241,233,.34)}
  .hero-A .hero-scap{position:absolute;left:0;bottom:48px;font-size:9px;letter-spacing:.22em;color:rgba(244,241,233,.45);font-family:"Archivo",sans-serif}
  .hero-A .tick{position:absolute;bottom:24px;transform:translateX(-50%)}
  .hero-A .tick i{display:block;width:1px;height:7px;background:rgba(244,241,233,.48);margin:0 auto}
  .hero-A .tick em{position:absolute;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;color:rgba(244,241,233,.52);font-family:"Archivo",sans-serif;letter-spacing:.1em}
  .hero-A .tick[data-p="0"]{transform:none}
  .hero-A .tick[data-p="0"] em{left:0;transform:none}
  .hero-A .tick[data-p="100"]{transform:translateX(-100%)}
  .hero-A .tick[data-p="100"] em{left:auto;right:0;transform:none}
  .hero-A .mark{position:absolute;left:40.73%;bottom:24px;transform:translateX(-50%)}
  .hero-A .mark i{display:block;width:1px;height:24px;background:#DDB98E;margin:0 auto}
  .hero-A .mark b{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;letter-spacing:.1em;color:#EBCBA3;font-weight:400}

  /* ---- B：纸白 + 铜版线描 ---- */
  .hero-B{background:var(--paper);color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,40%,540px);min-height:580px}
  .hero-B .hb-left{position:relative;padding:70px 40px 34px var(--hero-gut);display:flex;flex-direction:column;justify-content:space-between}
  .hero-B .hero-kicker{color:var(--gold)}
  .hero-B h2{font-size:clamp(28px,3vw,46px);line-height:1.26;color:var(--ink)}
  .hero-B h2 em{color:var(--gold)}
  .hero-B p{font-size:13px;line-height:2.1;color:var(--ink-soft);max-width:34ch}
  .hero-B .hero-actions .btn{background:var(--ink);color:var(--cream);border:1px solid var(--ink)}
  .hero-B .hero-actions .btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink)}
  .hero-B .hb-notes{display:flex;gap:48px;margin-top:30px}
  .hero-B .hb-note{position:relative;padding-top:13px}
  .hero-B .hb-note::before{content:"";position:absolute;top:0;left:0;width:34px;height:1px;background:#C9C3B2}
  .hero-B .hb-note b{display:block;font-size:26px;font-weight:400;color:var(--ink);font-family:"Archivo",sans-serif;line-height:1}
  .hero-B .hb-note span{display:block;font-size:10px;letter-spacing:.16em;color:var(--ink-faint);margin-top:5px}
  .hero-B .hb-scale{position:relative;width:min(560px,100%);height:44px;margin-top:34px}
  .hero-B .hb-scale .rail{position:absolute;left:0;right:0;bottom:20px;height:1px;background:#D4CFBF}
  .hero-B .hb-scale .tick{position:absolute;bottom:20px;transform:translateX(-50%)}
  .hero-B .hb-scale .tick i{display:block;width:1px;height:7px;background:#C6BFac;margin:0 auto}
  .hero-B .hb-scale .tick em{position:absolute;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--ink-faint);font-family:"Archivo",sans-serif}
  .hero-B .hb-scale .tick[data-p="0"]{transform:none}
  .hero-B .hb-scale .tick[data-p="0"] em{left:0;transform:none}
  .hero-B .hb-scale .tick[data-p="100"]{transform:translateX(-100%)}
  .hero-B .hb-scale .tick[data-p="100"] em{left:auto;right:0;transform:none}
  .hero-B .hb-scale .mark{position:absolute;left:40.73%;bottom:20px;transform:translateX(-50%)}
  .hero-B .hb-scale .mark i{display:block;width:1px;height:24px;background:var(--gold);margin:0 auto}
  .hero-B .hb-scale .mark b{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;letter-spacing:.08em;color:var(--gold);font-weight:400}
  .hero-B .hb-art{position:relative;border-left:1px solid var(--line);background:#F7F5EF;overflow:hidden}
  .hero-B .hb-art img{width:100%;height:100%;object-fit:cover;object-position:50% 44%;filter:contrast(1.04);display:block}
  .hero-B .hb-art .cap{position:absolute;left:24px;bottom:20px;font-size:9px;letter-spacing:.2em;color:#8C8A80;background:rgba(247,245,239,.92);padding:6px 9px}

  /* ---- C：双栏俯拍 + 竖向量规 ---- */
  .hero-C{background:var(--paper);display:grid;grid-template-columns:minmax(0,44%) minmax(0,1fr);min-height:620px}
  .hero-C .hc-shot{position:relative;overflow:hidden;background:#EFECE4}
  .hero-C .hc-shot img{width:100%;height:100%;object-fit:cover;object-position:52% 50%;display:block}
  .hero-C .hc-shot .tag{position:absolute;left:24px;top:24px;background:rgba(252,252,250,.92);padding:6px 11px;font-size:9px;letter-spacing:.18em;color:var(--ink)}
  .hero-C .hc-panel{position:relative;padding:56px clamp(136px,12.5vw,176px) 40px clamp(40px,4vw,60px)}
  .hero-C .hero-kicker{color:var(--gold)}
  .hero-C h2{font-size:clamp(25px,2.7vw,38px);line-height:1.32;color:var(--ink);margin-bottom:16px}
  .hero-C p{font-size:12.5px;line-height:2.05;color:var(--ink-soft);max-width:30ch}
  .hero-C .hero-actions{margin-top:30px}
  .hero-C .hero-actions .btn{background:var(--ink);color:var(--cream);border:1px solid var(--ink)}
  .hero-C .hero-actions .btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink)}
  .hero-C .hc-rows{margin-top:28px;border-top:1px solid var(--line)}
  .hero-C .hc-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  .hero-C .hc-row span{font-size:10px;letter-spacing:.16em;color:var(--ink-faint)}
  .hero-C .hc-row b{font-size:19px;font-weight:400;color:var(--ink);font-family:"Archivo",sans-serif}
  .hero-C .hc-row b i{font-style:normal;font-size:10px;color:var(--ink-soft);margin-left:4px;letter-spacing:.08em}
  .hero-C .hc-meter{position:absolute;right:clamp(20px,3.4vw,44px);top:56px;bottom:44px;width:124px}
  .hero-C .hc-meter .track{position:absolute;right:0;top:0;bottom:0;width:3px;background:#E6E1D2}
  .hero-C .hc-meter .fill{position:absolute;right:0;bottom:0;width:3px;background:var(--gold)}
  .hero-C .hc-meter em{position:absolute;right:9px;font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--ink-faint);font-family:"Archivo",sans-serif}
  .hero-C .hc-meter em.top{top:-5px}
  .hero-C .hc-meter em.base{bottom:-5px}
  .hero-C .hc-meter .lm{position:absolute;right:9px;text-align:right;transform:translateY(50%);white-space:nowrap}
  .hero-C .hc-meter .lm b{font-size:10px;color:var(--gold);font-weight:400}
  .hero-C .hc-meter .lm span{display:block;font-size:8.5px;color:var(--ink-faint);letter-spacing:.08em}

  /* 模板开关（顶栏） */
  .hero-switch{display:none;align-items:center;gap:2px;margin-left:auto;margin-right:16px;padding:3px 4px;border:1px solid rgba(244,241,233,.18)}
  .hero-switch.show{display:flex}
  .hero-switch .lbl{font-size:9.5px;letter-spacing:.16em;color:rgba(244,241,233,.45);padding:0 6px 0 3px}
  .hero-switch button{background:none;border:none;padding:4px 9px;font-size:10px;letter-spacing:.1em;color:rgba(244,241,233,.6);cursor:pointer;font-family:"Archivo",sans-serif}
  .hero-switch button.on{background:var(--cream);color:var(--espresso)}

  /* 窄屏：三套模板统一单列 */
  @media(max-width:820px){
    .hero-A{height:auto;min-height:0}
    .hero-A .hero-in{height:auto;justify-content:flex-start;padding:48px 16px 32px}
    .hero-A .hero-text{padding:0;max-width:none}
    .hero-A .hero-scale{margin:24px 0 0}
    .hero-A h2{font-size:27px}
    .hero-A p{font-size:12.5px;line-height:1.95;max-width:none}
    .hero-A .hero-actions{margin-top:24px}
    .hero-A .hero-stats{position:static;transform:none;text-align:left;display:flex;gap:24px;margin-top:26px}
    .hero-A .hero-stats .hs{display:block;margin:0}
    .hero-A .hero-stats .hs b{font-size:21px}
    .hero-A .hero-stats .hs span{display:block;margin-top:4px}
    .hero-A .hero-bg{object-position:66% 44%}
    .hero-A .hero-shade{background:linear-gradient(180deg,rgba(11,9,7,.60) 0%,rgba(11,9,7,.80) 44%,rgba(11,9,7,.94) 100%)}
    .hero-A .hero-scale{width:100%;margin-top:24px;height:48px}
    .hero-A .hero-scap{display:none}
    .hero-A .tick em{font-size:8px}

    .hero-B{grid-template-columns:1fr;min-height:0}
    .hero-B .hb-left{padding:44px 20px 30px}
    .hero-B h2{font-size:27px}
    .hero-B p{max-width:none;font-size:12.5px}
    .hero-B .hb-notes{gap:32px;margin-top:26px}
    .hero-B .hb-scale{width:100%;margin-top:20px}
    .hero-B .hb-art{border-left:none;border-top:1px solid var(--line);height:280px}
    .hero-B .hb-art .cap{left:16px;bottom:14px}

    .hero-C{grid-template-columns:1fr;min-height:0}
    .hero-C .hc-shot{height:240px}
    .hero-C .hc-shot .tag{left:16px;top:16px}
    .hero-C .hc-panel{padding:36px 20px 34px}
    .hero-C h2{font-size:26px}
    .hero-C p{max-width:none;font-size:12.5px}
    .hero-C .hc-rows{margin-top:26px}
    .hero-C .hc-meter{display:none}
    .hero-A .tick[data-v="250"] em,.hero-B .hb-scale .tick[data-v="250"] em{display:none}
    .hero-switch{position:absolute;right:16px;top:12px;margin:0;padding:2px 3px}
    .hero-switch .lbl{display:none}
    .topbar-in{position:relative}
  }

  .landing-section{margin-top:44px}
  .landing-section h3{font-weight:400;color:var(--ink);font-size:16px;margin-bottom:6px;letter-spacing:.12em}
  .landing-section .ls-sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;letter-spacing:.04em}
  .landing-grid{display:grid;gap:0;border-top:1px solid var(--line)}
  @media(min-width:820px){ .landing-grid{grid-template-columns:repeat(3,1fr)} }
  .landing-card{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;overflow:hidden;cursor:pointer}
  .landing-card:hover{border-color:var(--line)}
  .landing-card .lc-img{height:150px;background:var(--paper-2);object-fit:cover;width:100%;display:block}
  .landing-card .lc-img.thumb-ic{background:var(--gold-soft);color:var(--gold)}
  .landing-card .lc-img.thumb-ic .ic{width:44px;height:44px}
  .landing-card .lc-body{padding:16px 0}
  .landing-card .lc-name{font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.05em}
  .landing-card .lc-meta{margin-top:6px;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:baseline;gap:10px;letter-spacing:.04em}
  .landing-feats{display:grid;gap:0;margin-top:10px;border-top:1px solid var(--line)}
  @media(min-width:820px){ .landing-feats{grid-template-columns:repeat(3,1fr)} }
  .feat{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:20px 0}
  .feat .feat-ic{width:34px;height:34px;border:none;background:none;color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .feat .feat-ic .ic{width:20px;height:20px}
  .feat b{display:block;font-weight:500;color:var(--ink);margin-bottom:6px;font-size:12.5px;letter-spacing:.08em}
  .feat span{font-size:11px;color:var(--ink-soft);letter-spacing:.02em;line-height:1.9}
  .landing-foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line-strong);font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}

  /* ===== 窄屏（手机）适配 ===== */
  @media(max-width:520px){
    .wrap{padding:0 16px}
    .topbar-in{flex-direction:column;align-items:flex-start;gap:6px;padding:12px 0 0}
    .view-switch{width:100%;gap:20px;padding-bottom:11px;margin-left:0}
    .acct{display:none}
    .brand{font-size:11px;white-space:nowrap;letter-spacing:.08em}
    .view-switch button{padding:5px 0 4px;font-size:10.5px;letter-spacing:.06em}
    .admin-tabs{flex-wrap:wrap;gap:6px}
    .admin-tabs span{margin-left:0;flex-wrap:wrap}
    .admin-tabs .ghost-btn{padding:8px 10px;font-size:10.5px}
    .toolbar{flex-direction:column;align-items:stretch;gap:10px}
    .toolbar .search{min-width:0}
    .prod-top{flex-direction:column;align-items:stretch;gap:6px}
    .prod-kcal{white-space:normal}
    .hero-kicker{margin-bottom:18px;letter-spacing:.2em}
    .hero h2{font-size:29px;line-height:1.22;margin-bottom:16px}
    .hero p{font-size:12.5px;line-height:1.95;max-width:none}
    .hero-actions{margin-top:26px}
    .hero-actions .btn{padding:11px 16px;font-size:11px}
    .hero-stats{position:static;transform:none;text-align:left;display:flex;gap:26px;margin-top:30px}
    .hero-stats .hs{display:block;margin:0}
    .hero-stats .hs b{font-size:22px}
    .hero-stats .hs span{display:block;margin-top:4px}
    .hero-bg{object-position:66% 40%}
    .hero-shade{background:linear-gradient(180deg,rgba(11,9,7,.62) 0%,rgba(11,9,7,.78) 42%,rgba(11,9,7,.94) 100%)}
    .hero-scale{width:100%;margin-top:26px;height:50px}
    .hero-scap{display:none}
    .hero-scale .rail{bottom:22px}
    .hero-scale .tick{bottom:22px}
    .hero-scale .mark{bottom:22px}
    .hero-scale .tick em{font-size:8px}
    .row2{grid-template-columns:1fr}
    .total-bar{flex-wrap:wrap;gap:6px}
  }


  /* ===== 登录 / 鉴权 ===== */
  .acct{display:flex;align-items:center;gap:12px;margin-left:20px;min-width:104px;justify-content:flex-end;visibility:hidden}
  .acct.on{visibility:visible}
  .acct .who{font-size:9.5px;letter-spacing:.14em;color:var(--ink-soft);font-family:"Archivo",sans-serif}
  .acct .out{border:none;background:none;font:inherit;font-size:9.5px;letter-spacing:.14em;color:var(--ink-faint);
    cursor:pointer;padding:0 0 2px;border-bottom:1px solid var(--line-2)}
  .topbar:not(.light) .acct .who{color:rgba(244,241,233,.72)}
  .topbar:not(.light) .acct .out{color:rgba(244,241,233,.60);border-bottom-color:rgba(244,241,233,.28)}

  .lg{min-height:calc(100vh - 57px);background:var(--paper);display:flex;align-items:center;justify-content:center;padding:60px 24px}
  .lgbox{width:min(400px,100%)}
  .lg-kicker{font-size:10px;letter-spacing:.28em;color:var(--ink-faint);font-family:"Archivo",sans-serif}
  .lgbox h1{font-size:30px;font-weight:300;letter-spacing:.05em;margin:18px 0 0;line-height:1.35;color:var(--ink)}
  .lgsub{font-size:11.5px;color:var(--ink-soft);line-height:1.95;margin-top:12px;letter-spacing:.02em}
  .lgruler{position:relative;height:26px;margin:32px 0 26px;
    background:repeating-linear-gradient(90deg,#DCD8CA 0 1px,transparent 1px 28px) left bottom/100% 6px no-repeat;
    border-bottom:1px solid #CFCABA}
  .lgform{margin-top:26px}
  .lgfield{margin-bottom:20px}
  .lgfield label{display:block;font-size:9.5px;letter-spacing:.16em;color:var(--ink-faint);margin-bottom:8px;transition:color .18s}
  .lgfield input{width:100%;border:none;border-bottom:1.5px solid var(--line-strong);background:none;font:inherit;font-size:13px;
    padding:8px 0 9px;line-height:1.45;letter-spacing:.05em;color:var(--ink);outline:none;transition:border-color .18s}
  .lgfield input::placeholder{color:#B4B1A6;letter-spacing:.06em}
  .lgfield input:focus{border-bottom-color:var(--ink);box-shadow:0 1px 0 0 var(--ink)}
  .lgfield input:focus::placeholder{color:#9C9A8F}
  .lgfield.on label{color:var(--ink)}
  .lgfield input:disabled{opacity:.6}
  .lgbtn{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:12px;
    letter-spacing:.16em;padding:14px 0;cursor:pointer;margin-top:10px;transition:opacity .18s}
  .lgbtn:disabled{opacity:.45;cursor:default}
  .lgerr{font-size:10.5px;color:#9C4A38;letter-spacing:.04em;margin-top:12px;min-height:15px}

  .lgnote{font-size:10px;color:var(--ink-faint);line-height:1.95;margin-top:24px;letter-spacing:.02em}
  .lgback{border:none;background:none;font:inherit;font-size:10px;letter-spacing:.14em;color:var(--ink-soft);cursor:pointer;
    padding:0 0 3px;margin-top:20px;border-bottom:1px solid var(--line-2)}

  /* 后台 · 前台设置 */
  .set-head h2{font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--ink);margin:0 0 8px}
  .set-head p{font-size:11.5px;color:var(--ink-soft);line-height:1.95;margin:0;max-width:64ch}
  .set-sync{margin-top:12px;font-size:10.5px;letter-spacing:.06em;color:var(--gold);font-family:"Archivo",sans-serif}
  .set-list{margin-top:24px;border-top:1px solid var(--line-strong);max-width:1040px}
  .set-row{display:grid;grid-template-columns:132px minmax(0,1fr) 22px;gap:24px;align-items:center;
    padding:16px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
  .set-row:hover{background:var(--card-2)}

  async function publishSitePatch(patch){
    var snap=siteSnapshot();
    var val={heroStyle:snap.heroStyle||state.heroStyle||"A",
             loginMode:snap.loginMode||state.loginMode||"lazy"};
    Object.keys(patch||{}).forEach(function(k){ val[k]=patch[k]; });
    var body = JSON.stringify(Object.assign({},val,{updated:new Date().toISOString()}));
    try{ localStorage.setItem(SITE_KEY, body); }catch(e){}
    /* 1) settings 表：口令校验写入 */
    var pw = adminPass();
    if(pw){
      try{
        var r = await fetch(SUPA_CONFIG.url + "/rest/v1/rpc/t_set_site", {
          method:"POST",
          headers: Object.assign({"Content-Type":"application/json"}, supaHeaders()),
          body: JSON.stringify({p_tenant:adminTenant(), p_pass:pw, p_patch:val})
        });
        if(r.ok) return {ok:true, via:"table"};
        if(r.status === 401 || r.status === 403 || r.status === 400){
          return {ok:false, via:"table", reason:"pass"};
        }
      }catch(e){ console.error("rpc set_site_setting failed", e); }
    }
    /* 2) 回退：存储桶 JSON（settings 表未建时） */
    try{
      var r2 = await fetch(settingUploadUrl(), {
        method:"POST",
        headers:{
          "apikey":SUPA_CONFIG.anonKey,
          "Authorization":"Bearer "+SUPA_CONFIG.anonKey,
          "Content-Type":"application/json",
          "x-upsert":"true"
        },
        body:body
      });
      return {ok:r2.ok, via:"bucket"};
    }catch(e){ console.error("publish setting failed", e); return {ok:false, via:"none"}; }
  }

  /* 页面内二次确认，返回 Promise<boolean> */
  function askConfirm(o){
    return new Promise(function(resolve){
      var m=document.createElement("div"); m.className="askmask";
      m.innerHTML='<div class="askbox" role="dialog" aria-modal="true">'+
        '<div class="askh">'+esc(o.title||"确认操作")+'</div>'+
        '<div class="askb">'+(o.body||"")+'</div>'+
        '<div class="askf"><button class="btn ghost" data-a="0">'+esc(o.cancel||"取消")+'</button>'+
        '<button class="btn '+(o.danger?"danger":"")+'" data-a="1">'+esc(o.ok||"确定")+'</button></div></div>';
      document.body.appendChild(m);
      requestAnimationFrame(function(){ m.classList.add("open"); });
      var closed=false;
      function done(v){
        if(closed) return; closed=true;
        document.removeEventListener("keydown",onKey);
        m.classList.remove("open");
        setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); },180);
        resolve(v);
      }
      function onKey(e){ if(e.key==="Escape") done(false); if(e.key==="Enter") done(true); }
      document.addEventListener("keydown",onKey);
      m.addEventListener("click",function(e){ if(e.target===m) done(false); });
      m.querySelectorAll("[data-a]").forEach(function(b){ b.addEventListener("click",function(){ done(b.dataset.a==="1"); }); });
      setTimeout(function(){ var f=m.querySelector('[data-a="1"]'); if(f) f.focus(); },60);
    });
  }

  /* ---------- 饮品图片：前端压缩 + Storage 上传 ---------- */
  var IMG_BUCKET = "product-images";
  var IMG_MAX_W = 720, IMG_QUALITY = 0.72;

  function compressImage(file){
    return new Promise(function(resolve,reject){
      if(!file || !file.type || file.type.indexOf("image/")!==0){ reject(new Error("请选择图片文件")); return; }
      var url=URL.createObjectURL(file);
      var img=new Image();
      img.onload=function(){
        var w=img.width||IMG_MAX_W, h=img.height||IMG_MAX_W;
        if(w>IMG_MAX_W){ h=Math.round(h*IMG_MAX_W/w); w=IMG_MAX_W; }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        var ctx=c.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        c.toBlob(function(blob){
          if(blob){ resolve({blob:blob, dataUrl:c.toDataURL("image/jpeg",IMG_QUALITY)}); }
          else{ reject(new Error("图片压缩失败")); }
        }, "image/jpeg", IMG_QUALITY);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
      img.src=url;
    });
  }

  async function uploadImage(blob, prefix, objId){
    var path = prefix + "-" + objId + "-" + Date.now() + ".jpg";
    var pass = adminPass();
    /* 走原始 fetch：桶加了「认口令」策略后，必须带 x-admin-pass 头；
       没跑策略时这多一个头也无害，后台照常上传 */
    var r = await fetch(SUPA_CONFIG.url + "/storage/v1/object/" + IMG_BUCKET + "/" + path, {
      method: "POST",
      headers: Object.assign({"Content-Type":"image/jpeg", "x-upsert":"true", "x-admin-pass":pass}, supaHeaders()),
      body: blob
    });
    if(!r.ok){
      var msg = "";
      try{ var j = await r.json(); msg = (j && (j.message || j.error)) || ""; }catch(e){}
      if((r.status === 400 || r.status === 401 || r.status === 403) && !pass){
        throw new Error("未登录或登录已过期，请重新登录后再上传图片");
      }
      throw new Error(msg || ("图片上传失败（HTTP " + r.status + "）"));
    }
    return SUPA_CONFIG.url + "/storage/v1/object/public/" + IMG_BUCKET + "/" + path;
  }

  /* 从 public URL 反推桶内路径；dataURL / 非本桶地址返回 null */
  function storagePathFromUrl(url){
    if(!url || typeof url !== "string") return null;
    var marker = "/object/public/" + IMG_BUCKET + "/";
    var idx = url.indexOf(marker);
    if(idx < 0) return null;
    var path = url.slice(idx + marker.length);
    return path || null;
  }
  /* 删除旧图；失败仅记录，不阻断主流程 */
  async function deleteProductImage(imageUrl){
    if(!supaReady() || !imageUrl) return;

    if(!path) return;
    try{
      var r = await fetch(SUPA_CONFIG.url + "/storage/v1/object/" + IMG_BUCKET, {
        method: "DELETE",
        headers: Object.assign({"Content-Type":"application/json", "x-admin-pass":adminPass()}, supaHeaders()),
        body: JSON.stringify({prefixes:[path]})
      });
      if(!r.ok){ console.error('delete old image failed:', r.status); return; }
      var del = null;
      try{ del = await r.json(); }catch(e){}
      /* 被 RLS 拦掉时接口返回 200 + 空数组，不是报错；这里要看条数才能发现没删成 */
      if(!Array.isArray(del) || del.length === 0){
        console.warn('旧图未删除（口令缺失或策略拦截）:', path);

  /* 写库通道：优先走带口令的 RPC（收紧写权限后唯一可用路径）；
     若云端还没建对应函数（function does not exist），自动退回 REST 直写，
     保证「没跑 SQL」和「跑了 SQL」两种状态下后台都能正常保存 */
  function rpcMissing(err){
    var msg = String((err && (err.message || err.hint || err.details)) || "");
    var code = String((err && err.code) || "");
    return /Could not find the function|PGRST202|42883|does not exist/i.test(msg + " " + code);
  }
  /* ---------- 配料成本（独立表 ingredient_costs，不向 anon 公开，只走口令 RPC） ---------- */
  async function loadIngCosts(){
    if(!supaReady() || !sb) return;
    var pass = adminPass();
    if(!pass){ return; }
    try{
      var r = await sb.rpc("t_admin_list_costs", {p_tenant:adminTenant(), p_pass:pass});
      if(r.error){
        if(!rpcMissing(r.error)) console.warn("读取配料成本失败", r.error);
        return;
      }
      var map = {};
      (r.data||[]).forEach(function(x){ map[x.lid] = {q:Number(x.pack_qty)||0, p:Number(x.pack_price)||0, l:x.bean_label||""}; });
      db.ings.forEach(function(i){
        var c = map[i.id];
        i.packQty = c ? c.q : 0;
        i.packPrice = c ? c.p : 0;
        i.beanLabel = c ? c.l : "";
      });
    }catch(e){ console.warn("读取配料成本失败", e); }
  }
  async function saveIngCost(lid, qty, price, label){
    if(!supaReady() || !sb) return {ok:true, local:true};
    var pass = adminPass();
    if(!pass) return {ok:false, msg:"登录状态已失效，重新登录后再保存价格"};
    try{
      var r = await sb.rpc("t_admin_save_cost", {p_tenant:adminTenant(), p_pass:pass, p_lid:lid, p_qty:qty, p_price:price, p_label:(label||"")});
      if(r.error) return {ok:false, msg:"保存失败："+((r.error&&r.error.message)||r.error)};
      return {ok:true};
    }catch(e){ return {ok:false, msg:"保存失败："+((e&&e.message)||e)}; }
  }

  async function writeRows(table, rows, fn){
    if(!rows || !rows.length) return;
    var pass = adminPass();
    if(!pass) throw new Error("登录状态已失效，请重新登录");
    var first = await sb.rpc(fn, {p_tenant:adminTenant(), p_pass:pass, p_row:rows[0]});
    if(first && first.error) throw first.error;
    await Promise.all(rows.slice(1).map(function(row){
      return sb.rpc(fn, {p_tenant:adminTenant(), p_pass:pass, p_row:row}).then(function(r){
        if(r.error) throw r.error;
      });
    }));
  }
  async function removeRow(table, lid, fn){
    var pass = adminPass();
    if(!pass) throw new Error("登录状态已失效，请重新登录");
    var r = await sb.rpc(fn, {p_tenant:adminTenant(), p_pass:pass, p_lid:lid});
    if(r && r.error) throw r.error;
  }

  /* 全量对齐云端：本地优先，异步同步；失败仅提示，本地改动保留 */
  async function syncRemote(){
    if(!supaReady()) return true;
    try{
      const cat = await sb.rpc('t_catalog',{p_tenant:adminTenant()});
      if(cat.error) throw cat.error;
      const pack = cat.data || {};
      const oldIng = new Set((pack.ingredients||[]).map(function(r){return r.lid;}));
      const oldProd = new Set((pack.products||[]).map(function(r){return r.lid;}));

      if(db.ings.length) await writeRows('ingredients', db.ings.map(ingToRow), 'admin_save_ingredient');
      if(db.products.length) await writeRows('products', db.products.map(prodToRow), 'admin_save_product');

      const newIng = new Set(db.ings.map(function(x){return x.id;}));
      const newProd = new Set(db.products.map(function(x){return x.id;}));
      /* 注意：supabase-js 的请求是惰性的，必须 await / .then 才会真正发出 */
      for(const lid of Array.from(oldIng)){
        if(newIng.has(lid)) continue;
        await removeRow('ingredients', lid, 'admin_delete_ingredient');
      }
      for(const lid of Array.from(oldProd)){
        if(newProd.has(lid)) continue;
        await removeRow('products', lid, 'admin_delete_product');
      }
      return true;
    }catch(err){
      console.error('sync remote failed:', err);
      alert('保存到云端失败，本地改动已保留：' + ((err&&err.message)||err));
      return false;
    }
  }

  /* 启动：云端优先拉取；云端为空则写入示例数据；失败回退本机 */
  async function boot(){
    var siteSet = await loadSiteSetting();
    if(siteSet && siteSet.heroStyle){
      state.heroStyle = siteSet.heroStyle;
      if(siteSet.loginMode){ state.loginMode = siteSet.loginMode; try{ localStorage.setItem("cafe_login_mode_v1", siteSet.loginMode); }catch(e){} }
      try{ localStorage.setItem("heat_hero_style", siteSet.heroStyle); }catch(e){}
      state.siteUpdated = siteSet.updated || "";
      state.siteSource = siteSet.source || "";
    }else{
      var cache = cachedSiteSetting();
      if(cache){ state.siteUpdated = cache.updated || ""; }
    }
    if(!supaReady()){ db = load(); return; }
    try{
      sb = supabase.createClient(SUPA_CONFIG.url, SUPA_CONFIG.anonKey);
      const cat = await sb.rpc('t_catalog',{p_tenant:adminTenant()});
      if(cat.error) throw cat.error;
      const pack = cat.data || {};
      /* 商户被停用/到期：只读本机缓存，绝不回写云端，也不给进后台 */
      if(pack.status==="off"){ state.suspended=true; db=load(); return; }
      const ings = (pack.ingredients||[]).map(rowToIng);
      const prods = (pack.products||[]).map(rowToProduct);
      if(ings.length || prods.length){
        db = { ings:ings, products:prods };
      }else{
        db = defaultData();
        await syncRemote();
      }
      await loadIngCosts();   /* 已登录（口令还在 sessionStorage）就把采购价补回来 */
      await loadBeansCloud(); /* 豆价表也从云端拉一次（表没建就静默跳过） */
      save();
    }catch(e){
      console.error('remote load failed, fallback to localStorage:', e);
      db = load();
    }
  }

  function mdEsc(s){ return String(s==null?"":s).replace(/\|/g,"\\|").replace(/\n/g," "); }
  function exportMarkdown(){
    var pad=function(n){ return String(n).padStart(2,"0"); };
    var now=new Date();
    var stamp=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes());
    var L=[];
    L.push("# 杯记 · 饮品清单","");

    L.push("## 一、配料库","");
    L.push("| 配料 | 类别 | 单位 | 基准量 | 基准千焦 | 每单位大卡 | 备注 |");
    L.push("|---|---|---|---|---|---|---|");
    db.ings.forEach(function(i){
      L.push("| "+mdEsc(i.name)+" | "+mdEsc(i.category)+" | "+i.unit+" | "+(+i.base||100)+" | "+(+i.kJ||0)+" | "+r1(kcalPerUnit(i))+" | "+mdEsc(i.note||"")+" |");
    });
    L.push("");

    L.push("## 二、饮品配方","");
    BIG_CATS.forEach(function(big){
      var list=db.products.filter(function(p){return p.big===big;});
      if(!list.length) return;
      L.push("### "+big,"");
      list.forEach(function(p){
        var c=productKcal(p, defaultMilk(p));
        var t=tier(c.total,p.big);
        var price=(p.price!=null&&p.price!=="")?("¥"+p.price):"未定价";
        var size=p.size||"杯型未标注";
        L.push("#### "+mdEsc(p.name)+"（"+size+" · "+price+" · "+r1(c.total)+" 大卡 · "+t.label+"）","");
        L.push("| 配料 | 用量 | 大卡 | 占比 |");
        L.push("|---|---|---|---|");
        c.rows.forEach(function(r){
          if(r.missing){ L.push("| 配料缺失（"+mdEsc(r.ingId)+"） | "+r.qty+" | — | — |"); return; }
          var pct=c.total>0?Math.round(r.kcal/c.total*100):0;
          L.push("| "+mdEsc(r.ing.name)+" | "+r.qty+mdEsc(r.ing.unit)+(r.role==="milk"?"（牛奶位）":"")+" | "+r1(r.kcal)+" | "+pct+"% |");
        });
        L.push("");
      });
    });

    var blob=new Blob([L.join("\n")],{type:"text/markdown;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="杯记清单.md";

      return p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes());
    }catch(e){ return ""; }
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
  function r1(n){ return Math.round((+n||0)*10)/10; }
  function byId(arr,id){ return arr.find(function(x){return x.id===id;}); }

  function milkAvail(p){
    if(!p || !p.milkSwitch) return false;
    if(noMilkCat(p.big)) return false;
    return (p.milkOptions||[]).some(function(mid){ return !!ing(mid); });
  }
  function kcalPerUnit(i){ if(!i) return 0; return (+i.kJ||0)/KJ/(+i.base||100); }

  /* ---------- 原料成本：单价 = 采购价 / 净含量（元 / 每 g·ml） ---------- */
  function unitCostOf(i){
    if(!i) return 0;
    var q=+(i.packQty||0), p=+(i.packPrice||0);
    if(!(q>0) || !(p>0)) return 0;
    return p/q;
  }
  function hasCost(i){ return unitCostOf(i)>0; }

  function costOfProduct(p, milkId){
    var total=0, known=0, rows=[];
    p.items.forEach(function(it){
      var iid = it.role==="milk" ? (milkId||it.ingId) : it.ingId;
      var i = ing(iid), qty=+it.qty||0, c=unitCostOf(i)*qty;
      if(hasCost(i)) known++;
      total += c;
      rows.push({ing:i, qty:qty, cost:c, priced:hasCost(i)});
    });
    return { total:total, rows:rows, known:known, all:p.items.length };
  }
  function costRangeOf(p){
    var list = milkAvail(p) ? (p.milkOptions||[]).filter(function(m){ return !!ing(m); }) : [defaultMilk(p)];
    if(!list.length) return {min:null,max:null,minMilk:"",maxMilk:""};
    var min=null,max=null,minMilk="",maxMilk="";
    list.forEach(function(mid){
      var c=costOfProduct(p, mid);
      if(!c.known) return;
      if(min===null||c.total<min){ min=c.total; minMilk=mid; }
      if(max===null||c.total>max){ max=c.total; maxMilk=mid; }
    });
    return {min:min, max:max, minMilk:minMilk, maxMilk:maxMilk};
  }
  /* 按订单行找菜谱还原成本（仅「原料」口径，未含杯材与人工） */
  function costOfOrder(o){
    var total=0, complete=true, any=false;
    (o.items||[]).forEach(function(x){
      var p=db.products.filter(function(q){ return q.name===x.name; })[0];
      if(!p){ complete=false; return; }
      var c=costOfProduct(p, x.milk||defaultMilk(p));
      if(!c.known){ complete=false; } else { any=true; }
      total += c.total*(+x.qty||1);
    });
    return { total:total, complete:complete, any:any };
  }

  function pfDay(s){

  /* 到期日统一落在当天 23:59:59，当天仍然可用 */
  function pfEod(y,m,d){

  }
  function pfYmd(s){

  }
  function pfPlusDays(n, base){
    var b = base ? new Date(base) : new Date();

  function pfEchoText(mode, dateStr){
    if(mode==="forever") return '到期：<b>永久</b> — 只要状态是在用，顾客端就一直开着。';
    if(mode==="custom"){
      var d = pfYmd(dateStr);
      if(!d) return '到期：<b>请选择日期</b> — 当天 23:59 之前仍可用。';
      return '到期：<b>'+pfDay(d.toISOString())+' 23:59</b> — 当天仍可用，次日起顾客端关闭。';
    }
    var n = +mode || 30;
    var d2 = pfPlusDays(n);
    return '到期：<b>'+pfDay(d2.toISOString())+' 23:59</b>（自今天起 '+n+' 天）— 次日起关闭。';
  }
  function pfExpireValue(mode, dateStr){
    if(mode==="forever") return null;
    if(mode==="custom"){ var d = pfYmd(dateStr); return d; }
    return pfPlusDays(+mode || 30);
  }

    /* 到期档位切换（开号 / 行内编辑共用一套事件） */
    function bindChips(scope, prefix, onPick){
      Array.prototype.forEach.call(scope.querySelectorAll('[data-pfexp="'+prefix+'"]'), function(btn){
        btn.addEventListener("click", function(){
          var mode = btn.getAttribute("data-mode");
          Array.prototype.forEach.call(scope.querySelectorAll('[data-pfexp="'+prefix+'"]'), function(x){

          });

          var echoEl = document.getElementById(prefix==="new" ? "pfNewEcho" : "pfEEcho");
          if(dEl) dEl.style.display = (mode==="custom" ? "" : "none");
          onPick(mode, dEl ? dEl.value : "", echoEl);
        });
      });
    }
    bindChips(document.getElementById("pfNewChips"), "new", function(mode, dv, echoEl){
      state.pfNewMode = mode;
      if(mode==="custom" && dv) state.pfNewDate = dv;
      if(echoEl) echoEl.innerHTML = pfEchoText(mode, state.pfNewDate || newDate);
    });
    var nd = document.getElementById("pfNewDate");
    if(nd) nd.addEventListener("change", function(){
      state.pfNewDate = nd.value;
      var e = document.getElementById("pfNewEcho");
      if(e) e.innerHTML = pfEchoText(state.pfNewMode||"custom", nd.value);

    var ec = document.getElementById("pfEChips");

  async function pfLoad(){
    try{
      pfTenants = (await pfRpc("t_platform_list_tenants", {p_master:pfPass()})) || [];
      state.pfLoaded = true;
    }catch(e){
      if(e.status===401 || /42501|口令|permission/i.test(e.message||"")){
        setPfPass(""); state.pfErr="超管口令已失效，请重新输入";
      }else{
        toast("读取商户失败："+(e.message||e));
      }
      if(state.view==="platform") renderPlatform();
      return;
    }
    if(state.view==="platform") renderPlatform();
  }
  /* 改到期：优先用 t_platform_set_expire（能传 null 清空）；未执行那段 SQL 时降级到 update_tenant */
  async function pfSetExpire(id, iso){
    try{
      await pfRpc("t_platform_set_expire", {p_master:pfPass(), p_id:id, p_expire: iso});
    }catch(e){
      if(iso){
        await pfRpc("t_platform_update_tenant", {p_master:pfPass(), p_id:id, p_expire: iso});
      }else{
        throw new Error("改回永久需要先在 SQL Editor 执行 平台到期_可置空.sql");
      }
    }
  }
  async function pfAct(id, what){
    var t = pfTenants.filter(function(x){ return x.id===id; })[0];
    try{
      if(what==="edit"){
        if(state.pfEditId === id){ state.pfEditId=null; }
        else { state.pfEditId=id; state.pfEditMode=null; state.pfEditDate=null; }
        state.pfConfirmId=null;
        renderPlatform(); return;
      }
      if(what==="editCancel"){
        state.pfEditId=null; state.pfEditMode=null; state.pfEditDate=null;
        renderPlatform(); return;
      }
      if(what==="editSave"){
        if(!t) return;
        var nmEl=document.getElementById("pfEName"), npEl=document.getElementById("pfEPass");
        var nm=(nmEl?nmEl.value:"").trim();
        var np=(npEl?npEl.value:"").trim();
        if(!nm){ toast("店名不能空"); return; }
        if(np && np.length<6){ toast("口令至少 6 位"); return; }
        var mode = state.pfEditMode || (t.expire_at ? "custom" : "forever");
        var dstr = state.pfEditDate || pfDay(t.expire_at || pfPlusDays(30).toISOString());
        var exp = pfExpireValue(mode, dstr);
        if(mode==="custom" && !exp){ toast("请选一个到期日期"); return; }
        var saveBtn = app.querySelector('[data-pf="editSave"]');
        if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent="保存中…"; }
        if(nm !== (t.name||"")) await pfRpc("t_platform_update_tenant", {p_master:pfPass(), p_id:id, p_name:nm});
        if(np) await pfRpc("t_platform_update_tenant", {p_master:pfPass(), p_id:id, p_pass:np});
        await pfSetExpire(id, exp ? exp.toISOString() : null);
        toast("已保存 "+id+"：到期 "+(exp?pfDay(exp.toISOString()):"永久")+(np?"，口令已更新":""));
        if(np && id===adminTenant()) setAdminPass(np);
        state.pfEditId=null; state.pfEditMode=null; state.pfEditDate=null;
        await pfLoad(); return;
      }
      if(!t) return;
      if(what==="toggle"){
        /* 停用是"关整店"，要二次点击确认，但确认态也在页面里，不弹浏览器对话框 */
        if(t.status==="active" && state.pfConfirmId !== id){
          state.pfConfirmId=id; renderPlatform(); return;
        }
        state.pfConfirmId=null;
        await pfRpc("t_platform_update_tenant", {p_master:pfPass(), p_id:id, p_status: t.status==="active"?"suspended":"active"});
        toast(t.status==="active" ? ("已停用 "+id+"，顾客端随即关闭") : ("已启用 "+id));
      }
      await pfLoad();
    }catch(e){ toast("失败："+(e.message||e)); }
  }
  async function pfCreate(){
    var idEl=document.getElementById("pfNewId"), nmEl=document.getElementById("pfNewName"),
        psEl=document.getElementById("pfNewPass"), tpEl=document.getElementById("pfNewTpl");
    if(!idEl||!nmEl||!psEl||!tpEl) return;
    var id=(idEl.value||"").trim().toLowerCase();
    var name=(nmEl.value||"").trim();
    var pass=(psEl.value||"").trim();
    var tpl=tpEl.value;
    if(!/^[a-z0-9][a-z0-9_-]{1,11}$/.test(id)){ toast("商户编码格式不对：小写字母/数字/下划线/中划线，2–12 位"); return; }
    if(!name){ toast("给个店名"); return; }
    if(pass.length<6){ toast("口令至少 6 位"); return; }
    if(/^(platform|admin|master|root)$/.test(id)){ toast("这个编码是保留字，换一个"); return; }
    var mode = state.pfNewMode || "30";
    var dstr = state.pfNewDate || pfDay(pfPlusDays(30).toISOString());
    var exp = pfExpireValue(mode, dstr);
    if(mode==="custom"){
      if(!exp){ toast("请先选一个到期日期"); return; }
      if(exp <= new Date()){ toast("自定义日期要晚于今天"); return; }
    }
    var btn=document.getElementById("pfNewBtn");
    btn.disabled=true; btn.textContent="开号中…";
    try{
      var r = await pfRpc("t_platform_create_tenant", {p_master:pfPass(), p_id:id, p_name:name, p_pass:pass, p_template: tpl||null});
      var expNote = "永久";
      if(exp){
        try{ await pfSetExpire(id, exp.toISOString()); expNote = pfDay(exp.toISOString()); }
        catch(e){ expNote = "未写入（"+(e.message||e)+"）"; }
      }
      toast("已开号 "+id+"，菜单 "+(r&&r.products||0)+" 款，到期 "+expNote);
      state.pfNewMode="30"; state.pfNewDate=null;
      await pfLoad();
    }catch(e){
      toast("开号失败："+(e.message||e));
      if(document.getElementById("pfNewBtn")){ document.getElementById("pfNewBtn").disabled=false; document.getElementById("pfNewBtn").textContent="开号"; }
    }
  }

  async function setOrderStatus(no,st){
    if(!supaReady()){ alert("本机模式改不了云端订单状态。"); return; }
    try{
      var pass = adminPass();
      var r = pass ? await sb.rpc("t_admin_set_order_status",{p_tenant:adminTenant(), p_pass:pass, p_order_no:no, p_status:st}) : null;
      if(!r || (r.error && rpcMissing(r.error))){
        /* 云端还没建该函数：退回旧写法，保证未跑 SQL 时后台照常可用 */
        var u = await sb.from("orders").update({status:st,updated_at:new Date().toISOString()}).eq("tenant_id",adminTenant()).eq("order_no",no);
        if(u.error) throw u.error;
      }else if(r.error){
        throw r.error;
      }
      var o=adminOrders.filter(function(x){ return x.order_no===no; })[0];
      if(o) o.status=st;
      renderOrders();
    }catch(e){ alert("改状态失败："+((e&&e.message)||e)); }
  }

  async function deleteOrder(no){
    if(!supaReady()){ alert("本机模式删不了云端订单。"); return; }
    try{
      var pass=adminPass();
      if(!pass){ alert("登录状态已失效，请重新登录后再删。"); return; }
      var r=await sb.rpc("t_admin_delete_order",{p_tenant:adminTenant(), p_pass:pass, p_order_no:no});
      if(r.error) throw r.error;
      adminOrders=adminOrders.filter(function(x){ return x.order_no!==no; });
      renderOrders();
      toast("已删除订单 "+no);
    }catch(e){ alert("删除失败："+((e&&e.message)||e)); }
  }

  /* ----- 豆价计算：单杯咖啡豆成本 ----- */
  var BEAN_KEY = "cafe_bean_calc_v1";
  function beanRows(){
    try{
      /* 注意：state.beans=beanRows() 在 BEAN_KEY 赋值之前执行，这里必须用字面量键名，
         否则 getItem(undefined) 永远读不到 → 刷新后只剩默认 7 行（豆名/改过的克数全丢） */
      var raw = localStorage.getItem("cafe_bean_calc_v1");
      var d = raw ? JSON.parse(raw) : null;
      if(Array.isArray(d) && d.length) return d;
    }catch(e){}
    /* 初始值取自参考表格（227g 那袋没填价，留空而不是算成 0 元） */
    return [
      {id:"b1", grams:1000,  dose:18, price:118},
      {id:"b2", grams:454,   dose:18, price:168},
      {id:"b3", grams:227,   dose:18, price:""},
      {id:"b4", grams:500,   dose:18, price:73},
      {id:"b5", grams:504,   dose:18, price:98},
      {id:"b6", grams:602,   dose:18, price:75.75},
      {id:"b7", grams:150,   dose:15, price:57}
    ];
  }
  function beanCalc(b){
    var net=+b.grams||0, dose=+b.dose||0, price=(b.price===""||b.price==null)?"":(+b.price||0);
    var cups = dose>0 ? Math.floor(net/dose) : 0;
    var per = (net>0 && dose>0 && price!=="") ? (price*dose/net) : 0;
    var perFloor = (cups>0 && price!=="") ? price/cups : 0;
    var rest = dose>0 ? Math.max(0, net - cups*dose) : net;
    return {net:net, dose:dose, price:price, cups:cups, per:per, perFloor:perFloor, rest:rest, noPrice:price===""};
  }
  function saveBeans(push){
    try{ localStorage.setItem(BEAN_KEY, JSON.stringify(state.beans)); }catch(e){}
    if(push!==false) scheduleBeanPush();
  }

  /* ---------- 豆价表上云（表 bean_calc，同样只走口令 RPC，anon 读不到） ---------- */
  var beanSync = {state:"local", at:""};   /* local | ok | failed | pending */
  var beanPushTimer=null, beanPushBusy=false, beanPushAgain=false;
  function beanSyncText(){
    if(beanSync.state==="ok") return "已存云端" + (beanSync.at? " · "+beanSync.at : "");
    if(beanSync.state==="pending") return "正在存云端…";
    if(beanSync.state==="failed") return "云端没存上（先留在本机，下次改动会重试）";
    return "只在本机（未建豆价表或未登录）";
  }
  function paintBeanSync(){
    var el=document.querySelector("[data-bsync]");
    if(!el) return;
    el.textContent = beanSyncText();
    el.style.color = beanSync.state==="failed" ? "#A5533F" : "var(--ink-faint)";
  }
  function scheduleBeanPush(){
    if(!supaReady() || !sb || !adminPass()){ beanSync.state="local"; paintBeanSync(); return; }
    beanSync.state="pending"; paintBeanSync();
    clearTimeout(beanPushTimer);
    beanPushTimer=setTimeout(function(){ pushBeansCloud(); }, 900);
  }
  async function pushBeansCloud(){
    if(!supaReady() || !sb || !adminPass()){ beanSync.state="local"; paintBeanSync(); return {ok:false,local:true}; }
    if(beanPushBusy){ beanPushAgain=true; return {ok:false,busy:true}; }
    beanPushBusy=true;
    try{
      var r=await sb.rpc("t_admin_save_beans", {p_tenant:adminTenant(), p_pass:adminPass(), p_data: state.beans});
      if(r.error){
        if(rpcMissing(r.error)){ beanSync.state="local"; console.warn("豆价表 RPC 不存在，先存本机"); }
        else { beanSync.state="failed"; console.warn("豆价表上云失败", r.error); }
      }else{
        var d=new Date();
        beanSync.state="ok";
        beanSync.at=(d.getMonth()+1)+"-"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
      }
    }catch(e){ beanSync.state="failed"; console.warn("豆价表上云失败", e); }
    finally{
      beanPushBusy=false; paintBeanSync();
      if(beanPushAgain){ beanPushAgain=false; pushBeansCloud(); }
    }
  }
  async function loadBeansCloud(){
    if(!supaReady() || !sb || !adminPass()) return;
    try{
      var r=await sb.rpc("t_admin_list_beans", {p_tenant:adminTenant(), p_pass:adminPass()});
      if(r.error){ if(!rpcMissing(r.error)) console.warn("读取豆价表失败", r.error); return; }
      var d=r.data;
      if(typeof d==="string"){ try{ d=JSON.parse(d); }catch(e){ d=[]; } }
      if(d && !Array.isArray(d) && Array.isArray(d.rows)) d=d.rows;
      if(Array.isArray(d) && d.length){
        state.beans = d.map(function(b){ return {id:String(b.id||("b"+Math.random().toString(36).slice(2,7))), grams:b.grams, dose:b.dose, price:(b.price==null?"":b.price), label:(b.label||""), shop:(b.shop||""), ctype:(b.ctype==="电商"||b.ctype==="线下")?b.ctype:""}; });
        try{ localStorage.setItem(BEAN_KEY, JSON.stringify(state.beans)); }catch(e){}
        beanSync.state="ok"; beanSync.at="";
      }else{
        await pushBeansCloud();   /* 云端还空 → 把本机这份先传上去 */
      }
    }catch(e){ console.warn("读取豆价表失败", e); }
  }
  /* 罐重只做备忘，不参与任何计算 */
  var BEAN_NOTE_KEY = "cafe_bean_note_v1";
  function beanNote(){
    try{
      var raw = localStorage.getItem(BEAN_NOTE_KEY);
      var d = raw ? JSON.parse(raw) : null;
      if(d && typeof d.can !== "undefined") return d;
    }catch(e){}
    return {can:360};
  }
  function saveBeanNote(n){
    try{ localStorage.setItem(BEAN_NOTE_KEY, JSON.stringify(n)); }catch(e){}
  }

  /* ===== 豆价计算 · 询比价：全表按 ¥/kg 排榜 ===== */
  var BEAN_TYPES = ["电商","线下"];
  function beanKg(b){
    var net = +b.grams>0 ? +b.grams : 0;
    var p = (b.price===""||b.price==null) ? null : +b.price;
    if(!(net>0) || p===null || !(p>0)) return 0;
    return p/net*1000;
  }
  function beanTypeOf(b){ return (b.ctype==="电商"||b.ctype==="线下") ? b.ctype : ""; }

  function renderBeans(){
    var body=document.getElementById("adminBody");
    var rows=state.beans;
    var targets=db.ings.filter(function(i){ return i.category==="基底" && i.unit==="g"; });
    state.beanFilter = state.beanFilter || "all";
    state.beanSort = state.beanSort || "kg";
    var filter=state.beanFilter, sort=state.beanSort;

    var cnt={all:rows.length,ds:0,xx:0,none:0};
    rows.forEach(function(b){ var t=beanTypeOf(b); if(t==="电商")cnt.ds++; else if(t==="线下")cnt.xx++; else cnt.none++; });

    var list=rows.filter(function(b){
      if(filter==="all") return true;
      if(filter==="none") return !beanTypeOf(b);
      return beanTypeOf(b)===filter;
    });

    function pricedOf(arr){ return arr.filter(function(d){ return d.kg>0; }).sort(function(a,b){ return a.kg-b.kg; }); }
    function kpiOf(priced){
      if(!priced.length) return null;
      var n=priced.length, min=priced[0].kg, max=priced[n-1].kg;
      var mid = n%2 ? priced[(n-1)/2].kg : (priced[n/2-1].kg+priced[n/2].kg)/2;
      return {n:n,min:min,max:max,mid:mid,gap:max-min,spread:min>0?(max-min)/min*100:0,minRow:priced[0].b,maxRow:priced[n-1].b};
    }
    function kpiHtml(k){
      var v=function(x){ return x? '¥'+r2(x) : '—'; };
      var m=function(b){ return b ? esc(b.shop||b.label||"未填货源") : "还没有有效报价"; };
      if(!k){
        return '<div class="bkpi na"><div class="k">全表最低 · ¥/kg</div><div class="v">—</div><div class="m">先把每袋的克数和总价填上</div></div>'+
          '<div class="bkpi na"><div class="k">全表中位 · ¥/kg</div><div class="v">—</div><div class="m">—</div></div>'+
          '<div class="bkpi na"><div class="k">全表最高 · ¥/kg</div><div class="v">—</div><div class="m">—</div></div>'+
          '<div class="bkpi na"><div class="k">全表价差</div><div class="v">—</div><div class="m">—</div></div>';
      }
      return '<div class="bkpi low"><div class="k">全表最低 · ¥/kg</div><div class="v">'+v(k.min)+'</div><div class="m">'+m(k.minRow)+'</div></div>'+
        '<div class="bkpi mid"><div class="k">全表中位 · ¥/kg</div><div class="v">'+v(k.mid)+'</div><div class="m">'+k.n+' 份有效报价取中位</div></div>'+
        '<div class="bkpi high"><div class="k">全表最高 · ¥/kg</div><div class="v">'+v(k.max)+'</div><div class="m">'+m(k.maxRow)+'</div></div>'+
        '<div class="bkpi spread"><div class="k">全表价差</div><div class="v">'+Math.round(k.spread)+'<small>%</small></div><div class="m">最贵比最省每公斤贵 ¥'+r2(k.gap)+'</div></div>';
    }
    function chanStat(t){
      var arr=rows.filter(function(b){ return beanTypeOf(b)===t && beanKg(b)>0; });
      if(!arr.length) return null;
      var kgs=arr.map(beanKg).sort(function(a,b){ return a-b; });
      var avg=kgs.reduce(function(s,x){ return s+x; },0)/kgs.length;
      return {n:kgs.length,avg:avg,min:kgs[0],max:kgs[kgs.length-1]};
    }
    function chanHtml(){
      var parts=[], s1=chanStat("电商"), s2=chanStat("线下");
      parts.push(s1 ? '<span>电商 · '+s1.n+' 份　均价 <b>¥'+r2(s1.avg)+'</b>　¥'+r2(s1.min)+'–¥'+r2(s1.max)+'</span>'
                    : '<span>电商 · <b>暂无有效报价</b></span>');
      parts.push(s2 ? '<span>线下 · '+s2.n+' 份　均价 <b>¥'+r2(s2.avg)+'</b>　¥'+r2(s2.min)+'–¥'+r2(s2.max)+'</span>'
                    : '<span>线下 · <b>暂无有效报价</b></span>');
      if(s1 && s2){
        var hi=Math.max(s1.avg,s2.avg), lo=Math.min(s1.avg,s2.avg);
        var gap=(hi-lo)/hi*100;
        var cheaper = s1.avg<=s2.avg ? '电商' : '线下';
        var txt = gap<1 ? '两边均价基本持平' : cheaper+'均价便宜 '+Math.round(gap)+'%';
        parts.push('<span>结论 · <b>'+txt+'</b></span>');
      }
      return parts.join('');
    }

    var derived=rows.map(function(b,i){ var c=beanCalc(b); return {b:b,c:c,kg:beanKg(b),ord:i}; });
    var view=derived.filter(function(d){
      if(filter==="all") return true;
      if(filter==="none") return !beanTypeOf(d.b);
      return beanTypeOf(d.b)===filter;
    });
    if(sort==="kg"){
      view.sort(function(x,y){
        if(x.kg>0 && y.kg>0) return x.kg-y.kg;
        if(x.kg>0) return -1;
        if(y.kg>0) return 1;
        return x.ord-y.ord;
      });
    }else if(sort==="cup"){
      view.sort(function(x,y){
        var px=x.c.per>0?x.c.per:9e9, py=y.c.per>0?y.c.per:9e9;
        return px-py;
      });
    }else{
      view.sort(function(x,y){ return y.ord-x.ord; });
    }
    var allPriced=pricedOf(derived);
    var kpi=kpiOf(allPriced);
    var rankMap={}; allPriced.forEach(function(d,i){ rankMap[d.b.id]=i+1; });
    var bestId=allPriced.length?allPriced[0].b.id:null;

    var opts=targets.map(function(i){ return '<option value="'+i.id+'">'+esc(i.name)+'</option>'; }).join("");

    function kgCell(d,minKg,isBest){

      return '<b>¥'+r2(d.kg)+'</b><i>/kg</i>'+tag;
    }
    function perCell(d){
      return d.c.per>0 ? '<b>¥'+r2(d.c.per)+'</b>' : '<span class="pend">—</span>';
    }
    function cupsCell(d){ return d.c.cups>0 ? d.c.cups+' 杯' : '<span class="pend">—</span>'; }

    var tbody=view.map(function(d){
      var b=d.b, c=d.c;
      var cls=[]; if(d.kg>0 && b.id===bestId) cls.push("best"); if(!(d.kg>0)) cls.push("pending");
      return '<tr data-brow="'+b.id+'"'+(cls.length?' class="'+cls.join(" ")+'"':'')+'>'+
        '<td class="rk" data-brank>'+((rankMap[b.id]||"—"))+'</td>'+
        '<td><input type="text" data-bid="'+b.id+'" data-bf="label" value="'+esc(b.label||"")+'" placeholder="豆名，例：巴西 SOE" style="min-width:122px"></td>'+
        '<td><select data-bid="'+b.id+'" data-bf="ctype" style="width:76px">'+
          '<option value=""'+(!beanTypeOf(b)?' selected':'')+'>未选</option>'+
          BEAN_TYPES.map(function(t){ return '<option value="'+t+'"'+(b.ctype===t?' selected':'')+'>'+t+'</option>'; }).join("")+
        '</select></td>'+
        '<td><input type="text" data-bid="'+b.id+'" data-bf="shop" value="'+esc(b.shop||"")+'" placeholder="淘宝·店名 / 展会名" style="min-width:126px"></td>'+
        '<td><input type="number" data-bid="'+b.id+'" data-bf="grams" min="0" step="1" value="'+esc(b.grams==null?"":b.grams)+'" style="width:70px"></td>'+
        '<td><input type="number" data-bid="'+b.id+'" data-bf="dose" min="0" step="1" value="'+esc(b.dose==null?"":b.dose)+'" style="width:70px"></td>'+
        '<td><input type="number" data-bid="'+b.id+'" data-bf="price" min="0" step="0.01" value="'+esc(b.price==null?"":b.price)+'" style="width:78px"></td>'+
        '<td class="kg" data-bc="kg">'+kgCell(d, allPriced.length?allPriced[0].kg:0, b.id===bestId)+'</td>'+
        '<td class="cup" data-bc="per">'+perCell(d)+'</td>'+
        '<td class="cups" data-bc="cups">'+cupsCell(d)+'</td>'+
        '<td><div class="bean-wr">'+
          '<select data-btarget="'+b.id+'">'+(opts||'<option value="">无可用配料</option>')+'</select>'+
          '<button class="btn sm ghost" data-bapply="'+b.id+'">写入</button>'+
          '<div class="beam-cur" data-bcur="'+b.id+'"></div>'+
        '</div></td>'+
        '<td><button class="btn sm danger" data-bdel="'+b.id+'">删</button></td>'+
        '</tr>';
    }).join("");

    var thead='<tr>'+
      '<th>#</th><th>豆名</th><th>渠道</th><th>货源 / 商家</th>'+
      '<th>袋装 g</th><th>单杯 g</th><th>总价 ¥</th>'+
      '<th>单价 ¥/kg</th><th>单杯豆价</th><th>可做</th><th>写入配料</th><th></th>'+
      '</tr>';

        '· <b>单价 ¥/kg 是主口径</b>：总价 ÷ 袋装克数 × 1000，不受粉量和杯数影响，不同袋重、不同粉量能直接横比。<br>'+

        '· <b>排名与结论</b>：只统计「克数 + 总价」都填全的行；缺价的排在最后、不进最低/中位/最高。<br>'+

    /* ---- 局部刷新：只重写派生数值与高亮，不重排、不丢焦点 ---- */
    function refreshNumbers(){
      var arr=rows.map(function(b,i){ var c=beanCalc(b); return {b:b,c:c,kg:beanKg(b),ord:i}; });
      var priced=pricedOf(arr);
      var k=kpiOf(priced);
      var best=priced.length?priced[0].b.id:null;
      var rk={}; priced.forEach(function(d,i){ rk[d.b.id]=i+1; });
      var kb=document.getElementById("beanKpis"); if(kb) kb.innerHTML=kpiHtml(k);
      var cb=document.getElementById("beanChan"); if(cb) cb.innerHTML=chanHtml();
      arr.forEach(function(d){
        var tr=body.querySelector('[data-brow="'+d.b.id+'"]');
        if(!tr) return;
        var kgc=tr.querySelector('[data-bc="kg"]'), perc=tr.querySelector('[data-bc="per"]'), cupc=tr.querySelector('[data-bc="cups"]'), rkc=tr.querySelector('[data-brank]');
        if(kgc) kgc.innerHTML=kgCell(d, priced.length?priced[0].kg:0, d.b.id===best);
        if(perc) perc.innerHTML=perCell(d);
        if(cupc) cupc.innerHTML=cupsCell(d);
        if(rkc) rkc.textContent=(rk[d.b.id]||"—");
        tr.classList.toggle("best", d.kg>0 && d.b.id===best);
        tr.classList.toggle("pending", !(d.kg>0));
      });
    }

    document.getElementById("canWeight").addEventListener("input",function(e){
      var n=beanNote(); n.can=e.target.value; saveBeanNote(n);
    });

    var sortSel=document.getElementById("beanSort");
    if(sortSel) sortSel.addEventListener("change",function(){ state.beanSort=sortSel.value; renderBeans(); });

    body.querySelectorAll("[data-bchip]").forEach(function(btn){
      btn.addEventListener("click",function(){ state.beanFilter=btn.dataset.bchip; renderBeans(); });
    });

    document.getElementById("addBeanRow").addEventListener("click",function(){
      var nb={id:"b"+Date.now(), grams:250, dose:18, price:"", label:"", shop:"",
        ctype:(filter==="电商"||filter==="线下")?filter:""};
      state.beans.push(nb);
      saveBeans(); renderBeans();
      var tr=document.querySelector('[data-brow="'+nb.id+'"]');
      if(tr){
        tr.scrollIntoView({block:"center",behavior:"smooth"});
        tr.style.transition="background .45s ease";
        tr.style.background="rgba(198,148,72,.16)";

        var inp=tr.querySelector('[data-bf="label"]');
