<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饮品热量管理系统</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
  :root{
    --paper:#FCFCFA; --paper-2:#F4F3EF; --card:#FFFFFF; --card-2:#FAF9F5;
    --ink:#141410; --ink-soft:#6E6C63; --ink-faint:#8C8A80;
    --line:#E2DFD4; --line-strong:#D5D2C7;
    --espresso:#181510; --espresso-2:#0F0D0A; --cream:#F4F1E9;
    --gold:#7A4E33; --gold-soft:#EFE7DE; --caramel:#7A4E33;
    --accent:#7A4E33; --accent-soft:#F1EBE4;
    --low:#3F6B52; --low-bg:#EDF2EE;
    --mid:#8A6A2F; --mid-bg:#F5EFE3;
    --high:#9C4A38; --high-bg:#F7E9E5;
    --radius:6px; --radius-sm:4px;
    --shadow:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#F0EFEB;color:var(--ink);line-height:1.6;padding-bottom:56px;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;width:100%;margin:0 auto;padding:0 20px}
  .num,.prod-kcal,.ing-kcal,.total-bar .big,.ordno{font-family:"Archivo","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:20;background:var(--espresso);border-bottom:1px solid var(--espresso-2)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
  .brand{font-weight:500;color:var(--cream);font-size:13px;letter-spacing:.22em;display:flex;align-items:center;gap:10px}
  .brand::before{content:"";width:3px;height:15px;background:#8C6A4E;display:inline-block;flex:none}
  .view-switch{display:flex;gap:20px;background:none;padding:0}
  .view-switch button{
    border:none;background:none;color:rgba(244,241,233,.55);font:inherit;font-size:11.5px;letter-spacing:.14em;
    padding:6px 0 5px;cursor:pointer;white-space:nowrap;border-bottom:1px solid transparent;
  }
  .view-switch button.active{background:none;color:var(--cream);font-weight:400;border-bottom:1px solid var(--cream);box-shadow:none}

  h1.page-title{font-weight:400;color:var(--ink);font-size:21px;margin:30px 0 6px;letter-spacing:.06em}
  .page-sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:22px;max-width:64ch;letter-spacing:.02em;line-height:1.9}

  /* ===== 通用卡片/控件 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .ic{width:1em;height:1em;flex:none}
  .thumb-ic{display:flex;align-items:center;justify-content:center;background:var(--gold-soft)!important;color:var(--gold);flex:none}
  .thumb-ic.mono{font-family:"Noto Sans SC",sans-serif;font-size:15px;color:#7A4E33;letter-spacing:0;line-height:1}
  .thumb-ic .ic{width:46%;height:46%}
  .card h2{font-weight:500;font-size:14px;color:var(--ink);margin-bottom:5px;letter-spacing:.1em}
  .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;letter-spacing:.02em}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
  .chip{
    border:1px solid var(--line);background:none;color:var(--ink-soft);
    font:inherit;font-size:11.5px;padding:8px 13px;border-radius:0;cursor:pointer;letter-spacing:.06em;
  }
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:7px;font-weight:400;letter-spacing:.1em}
  .field input,.field select,.field textarea{
    width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--card-2);font:inherit;color:var(--ink);font-size:14px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:1px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{padding:12px 18px;border:none;border-radius:var(--radius-sm);background:var(--ink);color:#fff;font:inherit;font-weight:400;font-size:12.5px;letter-spacing:.12em;cursor:pointer}
  .btn:active{opacity:.86}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--line-strong)}
  .btn.sm{padding:7px 12px;font-size:11px;border-radius:2px;letter-spacing:.06em}
  .btn.danger{background:none;color:var(--high);border:1px solid #DCC3BB}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .toolbar{display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap}
  .search{flex:1;min-width:160px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card-2);font:inherit;color:var(--ink);font-size:13px}
  .search:focus{outline:1px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
  .ghost-btn{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11px;cursor:pointer;padding:8px 10px;border-radius:2px;white-space:nowrap;letter-spacing:.08em}
  .ghost-btn:hover{background:var(--paper-2);color:var(--ink)}
  .check-list{display:flex;flex-direction:column;gap:9px}
  .check-row{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;cursor:pointer}
  .check-row input{width:15px;height:15px;accent-color:var(--ink)}
  .qty-chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px}
  .qty-chip{border:1px solid var(--line);background:none;color:var(--ink-soft);font:inherit;font-size:11px;padding:5px 10px;border-radius:2px;cursor:pointer;letter-spacing:.04em}
  .qty-chip:active{background:var(--paper-2)}

  /* ===== 后台布局 ===== */
  .admin-tabs{display:flex;gap:24px;margin:4px 0 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
  .admin-tabs button{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:12.5px;letter-spacing:.1em;
    padding:6px 0 12px;cursor:pointer;border-bottom:2px solid transparent}
  .admin-tabs button.active{background:none;color:var(--ink);font-weight:500;border-bottom:2px solid var(--ink)}

  .grid{display:grid;gap:16px}
  @media(min-width:820px){ .grid.two{grid-template-columns:1fr 1fr} }

  /* 配料表 */
  .ing-table{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .ing-row{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;display:flex;gap:14px;background:none}
  .ing-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ing-name{font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.04em}
  .ing-cat{font-size:10.5px;color:var(--ink-faint);margin-left:9px;font-weight:400;letter-spacing:.06em}
  .ing-meta{margin-top:7px;font-size:11.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 16px;letter-spacing:.02em}
  .ing-kcal{font-weight:400;color:var(--gold);font-size:13px}
  .ing-ops{display:flex;gap:4px;margin-top:10px}
  .ing-ops .btn{background:none;border:none;padding:5px 8px;font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em}
  .ing-ops .btn:hover{color:var(--ink);background:var(--paper-2)}
  .ing-ops .btn.danger{color:#A8635A;border:none;background:none}
  .ing-ops .btn.danger:hover{color:#8E4436;background:#F7EDEA}
  .ing-thumb{width:46px;height:46px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .ing-body{flex:1;min-width:0}

  /* 产品卡片 */
  .prod-list{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
  .prod{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0;display:flex;gap:14px}
  .prod-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .prod-name{font-weight:400;font-size:14.5px;color:var(--ink);letter-spacing:.05em}
  .prod-cat{font-size:10.5px;color:var(--ink-faint);margin-left:9px;font-weight:400;letter-spacing:.06em}
  .prod-kcal{font-weight:400;font-size:19px;color:var(--ink);white-space:nowrap}
  .prod-kcal small{font-size:10.5px;color:var(--ink-soft);font-weight:400;letter-spacing:.1em}
  .prod-meta{margin-top:7px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:0;font-weight:400;letter-spacing:.08em}
  .tag.low{background:var(--low-bg);color:var(--low)}
  .tag.mid{background:var(--mid-bg);color:var(--mid)}
  .tag.high{background:var(--high-bg);color:var(--high)}

  /* ===== C 端预览 ===== */
  .shop-grid{display:grid;gap:0;border-top:1px solid var(--line)}
  @media(min-width:820px){ .shop-grid{grid-template-columns:1fr 1fr;column-gap:44px} }
  .shop-card{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;cursor:pointer;display:flex;gap:14px}
  .shop-card:hover{border-color:var(--line);transform:none}
  .shop-card:active{background:var(--paper-2)}
  .shop-card .prod-kcal{font-size:22px}
  .shop-meta{margin-top:8px;font-size:11.5px;color:var(--ink-soft);letter-spacing:.02em}
  .price{font-weight:400;color:var(--ink);font-size:14px;font-family:"Archivo",sans-serif}

  /* 饮品图片 */
  .prod-thumb{width:54px;height:54px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .prod-body{flex:1;min-width:0}
  .shop-card .prod-body{overflow:hidden}
  .shop-thumb{width:70px;height:70px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .shop-card .prod-top,.shop-card .shop-meta{min-width:0}
  .detail-img{width:100%;height:170px;object-fit:cover;border-radius:2px;margin-bottom:16px;background:var(--paper-2)}
  .detail-img.thumb-ic .ic{width:56px;height:56px}
  .img-uploader{display:flex;gap:14px;align-items:center;margin-bottom:14px}
  .img-preview{width:82px;height:82px;border-radius:2px;object-fit:cover;background:var(--paper-2);border:1px solid var(--line);flex:none}
  .img-ops{display:flex;flex-direction:column;gap:8px}
  .img-hint{font-size:10.5px;color:var(--ink-soft);letter-spacing:.02em}

  .detail-head{display:flex;align-items:center;gap:10px;margin:20px 0}
  .back{border:none;background:none;color:var(--ink-soft);font:inherit;font-size:11.5px;cursor:pointer;padding:6px 4px;letter-spacing:.1em}
  .detail-card{margin-top:8px}
  .milk-switch{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}

  .split-list{display:flex;flex-direction:column;gap:0;margin-top:14px;border-top:1px solid var(--line-strong)}
  .split-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px solid var(--line-2);padding:11px 0}
  .split-row:last-child{border-bottom:none}
  .split-row .s-left{display:flex;gap:10px;align-items:center;min-width:0}
  .s-thumb{width:34px;height:34px;border-radius:2px;object-fit:cover;background:var(--paper-2);flex:none}
  .split-row .s-name{color:var(--ink);letter-spacing:.03em}
  .split-row .s-meta{color:var(--ink-soft);font-size:11px}
  .split-row .s-kcal{font-weight:400;color:var(--gold);white-space:nowrap;font-family:"Archivo",sans-serif}
  .split-row .s-pct{font-weight:400;font-size:10px;color:var(--ink-soft)}
  .total-bar{margin-top:18px;background:var(--espresso);color:var(--cream);border-radius:2px;padding:18px 20px;display:flex;justify-content:space-between;align-items:baseline}
  .total-bar .big{font-weight:300;font-size:30px;letter-spacing:-.01em}
  .total-bar small{color:rgba(244,241,233,.6);letter-spacing:.12em;font-size:10px}

  /* ===== 弹层 ===== */
  .overlay{position:fixed;inset:0;background:rgba(20,20,16,.45);z-index:30;display:none;padding:18px;overflow-y:auto}
  .overlay.open{display:block}
  .modal{background:var(--paper);border-radius:2px;max-width:560px;margin:24px auto;padding:26px 26px 0}
  .modal h2{font-weight:500;color:var(--ink);margin-bottom:16px;padding-bottom:14px;font-size:15px;letter-spacing:.12em;border-bottom:1px solid var(--line)}
  .modal .btn-row{position:sticky;bottom:0;background:var(--paper);padding:16px 0 18px;margin-top:22px;border-top:1px solid var(--line);z-index:2;box-shadow:0 -12px 16px -14px rgba(20,20,16,.28)}
  .modal .ing-row-edit .field{margin-bottom:0}
  .ing-row-edit{border:1px solid var(--line);border-radius:2px;padding:14px;margin-bottom:10px;background:var(--card-2)}
  .ing-row-edit .row2{align-items:end}

  .note{margin-top:26px;font-size:10.5px;color:var(--ink-soft);line-height:2;max-width:66ch;letter-spacing:.02em}
  .note b{color:var(--ink);font-weight:500}
  .empty{color:var(--ink-faint);font-size:12.5px;padding:44px 0;text-align:center;letter-spacing:.06em}

  /* ===== 订单看板 ===== */
  .legend{display:flex;justify-content:flex-end;font-size:10px;color:var(--ink-faint);letter-spacing:.08em;padding:2px 0 8px}
  .mockbar{background:#F4EEE6;border:1px solid #E4D6C6;color:#7A4E33;font-size:10.5px;letter-spacing:.08em;padding:8px 12px;margin-bottom:16px}
  .ordbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
  .ordbar .cnt{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
  .ordbar .cnt b{font-family:"Archivo",sans-serif;font-size:20px;font-weight:400;color:var(--ink);margin-right:5px}
  .ordlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .ord{border-bottom:1px solid var(--line);padding:18px 0}
  .ord.wait{background:linear-gradient(90deg,rgba(122,78,51,.05),rgba(122,78,51,0) 60%)}
  .ord-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .ordno{font-size:26px;font-weight:400;letter-spacing:.06em;line-height:1.1}
  .ord-time{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}
  .ord-items{margin-top:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.9}
  .ord-items b{color:var(--ink);font-weight:400}
  .ord-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .ord-sum{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em}
  .ord-sum b{font-family:"Archivo",sans-serif;font-size:15px;color:var(--ink);font-weight:400}
  .ord-ops{display:flex;gap:8px;flex-wrap:wrap}
  .st{display:inline-block;font-size:10px;padding:3px 9px;letter-spacing:.1em;border-radius:0}
  .st.wait{background:#F2E6DB;color:#7A4E33}
  .st.make{background:#EDF2EE;color:#3F6B52}
  .st.done{background:var(--paper-2);color:var(--ink-soft)}
  .st.void{background:#F7E9E5;color:#9C4A38}
  .ord-note{margin-top:8px;font-size:11px;color:var(--gold);letter-spacing:.02em}

  /* ===== 品牌落地页 ===== */
  /* ===== Hero：暗场实拍 + 刻度尺 ===== */
  .hero{position:relative;background:#14110E;color:var(--cream);overflow:hidden;padding:0}
  .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 56%;z-index:0}
  .hero-shade{position:absolute;inset:0;z-index:1;background:
    linear-gradient(90deg,rgba(11,9,7,.92) 0%,rgba(11,9,7,.80) 26%,rgba(11,9,7,.48) 54%,rgba(11,9,7,.22) 78%,rgba(11,9,7,.34) 100%),
    linear-gradient(180deg,rgba(11,9,7,.30) 0%,rgba(11,9,7,0) 34%,rgba(11,9,7,.46) 100%)}
  .hero-in{position:relative;z-index:2;padding:80px 0 40px;min-height:700px;display:flex;flex-direction:column;justify-content:space-between}
  .hero-kicker{font-size:10px;letter-spacing:.28em;color:rgba(244,241,233,.62);font-weight:400;margin-bottom:26px}
  .hero h2{font-weight:300;font-size:clamp(34px,4.1vw,60px);line-height:1.16;letter-spacing:.02em;color:#FCFCFA;margin:0 0 22px}
  .hero h2 em{font-style:normal;color:#D8BD9E}
  .hero p{color:rgba(244,241,233,.68);max-width:44ch;font-size:13.5px;line-height:2.05;letter-spacing:.03em;margin:0}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px}
  .hero-actions .btn{padding:13px 22px;background:#FCFCFA;color:#14110E;letter-spacing:.14em;font-size:12px;border:1px solid #FCFCFA}
  .hero-actions .btn.ghost{background:rgba(252,252,250,.04);border:1px solid rgba(244,241,233,.34);color:rgba(244,241,233,.92);backdrop-filter:blur(2px)}
  .hero-stats{position:absolute;right:0;top:52%;transform:translateY(-50%);text-align:right;margin:0;padding:0;border:none}
  .hero-stats .hs{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;margin-bottom:16px}
  .hero-stats .hs b{font-size:30px;font-weight:300;color:#FCFCFA;font-family:"Archivo",sans-serif;letter-spacing:-.01em;line-height:1}
  .hero-stats .hs span{font-size:10px;color:rgba(244,241,233,.5);letter-spacing:.16em}
  .hero-scale{position:relative;width:min(840px,100%);height:58px;margin:46px 0 0}
  .hero-scale .rail{position:absolute;left:0;right:0;bottom:26px;height:1px;background:rgba(244,241,233,.34)}
  .hero-scap{position:absolute;left:0;bottom:54px;font-size:9px;letter-spacing:.22em;color:rgba(244,241,233,.45);font-family:"Archivo",sans-serif}
  .hero-scale .tick{position:absolute;bottom:26px;transform:translateX(-50%)}
  .hero-scale .tick i{display:block;width:1px;height:8px;background:rgba(244,241,233,.48);margin:0 auto}
  .hero-scale .tick em{position:absolute;top:13px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:9px;color:rgba(244,241,233,.52);font-family:"Archivo",sans-serif;letter-spacing:.1em}
  .hero-scale .tick[data-p="0"]{transform:none}
  .hero-scale .tick[data-p="0"] em{left:0;transform:none}
  .hero-scale .tick[data-p="100"]{transform:translateX(-100%)}
  .hero-scale .tick[data-p="100"] em{left:auto;right:0;transform:none}
  .hero-scale .mark{position:absolute;left:40.73%;bottom:26px;transform:translateX(-50%)}
  .hero-scale .mark i{display:block;width:1px;height:26px;background:#DDB98E;margin:0 auto}
  .hero-scale .mark b{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;letter-spacing:.1em;color:#EBCBA3;font-weight:400}
  .landing-section{margin-top:44px}
  .landing-section h3{font-weight:400;color:var(--ink);font-size:16px;margin-bottom:6px;letter-spacing:.12em}
  .landing-section .ls-sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:18px;letter-spacing:.04em}
  .landing-grid{display:grid;gap:0;border-top:1px solid var(--line)}
  @media(min-width:820px){ .landing-grid{grid-template-columns:repeat(3,1fr)} }
  .landing-card{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;overflow:hidden;cursor:pointer}
  .landing-card:hover{border-color:var(--line)}
  .landing-card .lc-img{height:150px;background:var(--paper-2);object-fit:cover;width:100%;display:block}
  .landing-card .lc-img.thumb-ic{background:var(--gold-soft);color:var(--gold)}
  .landing-card .lc-img.thumb-ic .ic{width:44px;height:44px}
  .landing-card .lc-body{padding:16px 0}
  .landing-card .lc-name{font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.05em}
  .landing-card .lc-meta{margin-top:6px;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:baseline;gap:10px;letter-spacing:.04em}
  .landing-feats{display:grid;gap:0;margin-top:10px;border-top:1px solid var(--line)}
  @media(min-width:820px){ .landing-feats{grid-template-columns:repeat(3,1fr)} }
  .feat{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:20px 0}
  .feat .feat-ic{width:34px;height:34px;border:none;background:none;color:var(--gold);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .feat .feat-ic .ic{width:20px;height:20px}

<script>
(function(){

  /* ---------- Supabase 配置（公开级 anon key，可写前端） ----------

  var SUPA_CONFIG = {

    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBudWNzdXhrZHV2d3Bna2xpem13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0ODI0MjEsImV4cCI6MjExMTA1ODQyMX0.8H2mNE3KEXZmHdXpV92pJ80OeN_gKAGvVZ69l0zwBGw"

         items:[{ingId:"o2", qty:300, role:"other"},{ingId:"s7", qty:25, role:"other"}], desc:""}

  function load(){
    try{ var raw=localStorage.getItem(LS_KEY); if(raw){ var d=JSON.parse(raw); if(d && d.ings && d.products) return d; } }catch(e){}
    return defaultData();

  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(e){} }

  /* ---------- 云端字段映射（前端字段名不变，仅在边界转换） ---------- */
  function ingToRow(i){
    return { lid:i.id, name:i.name, category:i.category, unit:i.unit,
      base:Number(i.base)||100, kJ:Number(i.kJ)||0, note:i.note||"", image:i.image||"" };
  }
  function rowToIng(r){
    return { id:r.lid, name:r.name, category:r.category, unit:r.unit,
      base:Number(r.base)||100, kJ:Number(r.kJ)||0, note:r.note||"", image:r.image||"" };
  }
  function prodToRow(p){
    return { lid:p.id, name:p.name, big:p.big, milk_switch:!!p.milkSwitch,
      milk_options:(p.milkOptions||[]).slice(),
      items:JSON.parse(JSON.stringify(p.items||[])), desc:p.desc||"",
      price:(p.price===null||p.price==="")?null:Number(p.price)||null,
      size:p.size||"", image:p.image||"" };
  }
  function rowToProduct(r){
    return { id:r.lid, name:r.name, big:r.big, milkSwitch:!!r.milk_switch,
      milkOptions:Array.isArray(r.milk_options)?r.milk_options:[],
      items:Array.isArray(r.items)?r.items:[], desc:r.desc||"",
      price:(r.price==null||r.price==="")?"":Number(r.price), size:r.size||"",
      image:r.image||"" };
  }

  /* ---------- 饮品图片：前端压缩 + Storage 上传 ---------- */
  var IMG_BUCKET = "product-images";
  var IMG_MAX_W = 720, IMG_QUALITY = 0.72;

  function compressImage(file){
    return new Promise(function(resolve,reject){
      if(!file || !file.type || file.type.indexOf("image/")!==0){ reject(new Error("请选择图片文件")); return; }
      var url=URL.createObjectURL(file);
      var img=new Image();
      img.onload=function(){
        var w=img.width||IMG_MAX_W, h=img.height||IMG_MAX_W;
        if(w>IMG_MAX_W){ h=Math.round(h*IMG_MAX_W/w); w=IMG_MAX_W; }
        var c=document.createElement("canvas"); c.width=w; c.height=h;
        var ctx=c.getContext("2d");
        ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        c.toBlob(function(blob){
          if(blob){ resolve({blob:blob, dataUrl:c.toDataURL("image/jpeg",IMG_QUALITY)}); }
          else{ reject(new Error("图片压缩失败")); }
        }, "image/jpeg", IMG_QUALITY);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
      img.src=url;
    });
  }

  async function uploadImage(blob, prefix, objId){
    var path = prefix + "-" + objId + "-" + Date.now() + ".jpg";
    var up = await sb.storage.from(IMG_BUCKET).upload(path, blob, {contentType:"image/jpeg", upsert:true});
    if(up.error) throw up.error;
    var pub = sb.storage.from(IMG_BUCKET).getPublicUrl(path);
    return (pub.data && pub.data.publicUrl) || "";
  }

  /* 从 public URL 反推桶内路径；dataURL / 非本桶地址返回 null */
  function storagePathFromUrl(url){
    if(!url || typeof url !== "string") return null;
    var marker = "/object/public/" + IMG_BUCKET + "/";
    var idx = url.indexOf(marker);
    if(idx < 0) return null;
    var path = url.slice(idx + marker.length);
    return path || null;
  }
  /* 删除旧图；失败仅记录，不阻断主流程 */
  async function deleteProductImage(imageUrl){
    if(!supaReady() || !imageUrl) return;
    var path = storagePathFromUrl(imageUrl);
    if(!path) return;
    try{ await sb.storage.from(IMG_BUCKET).remove([path]); }
    catch(e){ console.error('delete old image failed:', e); }
  }

  /* 全量对齐云端：本地优先，异步同步；失败仅提示，本地改动保留 */
  async function syncRemote(){
    if(!supaReady()) return;
    try{
      const old = await Promise.all([
        sb.from('ingredients').select('lid'),
        sb.from('products').select('lid')
      ]);
      if(old[0].error) throw old[0].error;
      if(old[1].error) throw old[1].error;
      const oldIng = new Set((old[0].data||[]).map(function(r){return r.lid;}));
      const oldProd = new Set((old[1].data||[]).map(function(r){return r.lid;}));

      if(db.ings.length) await sb.from('ingredients').upsert(db.ings.map(ingToRow),{onConflict:'lid'});
      if(db.products.length) await sb.from('products').upsert(db.products.map(prodToRow),{onConflict:'lid'});

      const newIng = new Set(db.ings.map(function(x){return x.id;}));
      oldIng.forEach(function(lid){ if(!newIng.has(lid)) sb.from('ingredients').delete().eq('lid',lid); });
      const newProd = new Set(db.products.map(function(x){return x.id;}));
      oldProd.forEach(function(lid){ if(!newProd.has(lid)) sb.from('products').delete().eq('lid',lid); });
    }catch(err){
      console.error('sync remote failed:', err);
      alert('保存到云端失败，本地改动已保留：' + ((err&&err.message)||err));
    }
  }

  /* 启动：云端优先拉取；云端为空则写入示例数据；失败回退本机 */
  async function boot(){
    if(!supaReady()){ db = load(); return; }
    try{
      sb = supabase.createClient(SUPA_CONFIG.url, SUPA_CONFIG.anonKey);
      const res = await Promise.all([
        sb.from('ingredients').select('*'),
        sb.from('products').select('*')
      ]);
      if(res[0].error) throw res[0].error;
      if(res[1].error) throw res[1].error;
      const ings = (res[0].data||[]).map(rowToIng);
      const prods = (res[1].data||[]).map(rowToProduct);
      if(ings.length || prods.length){
        db = { ings:ings, products:prods };
      }else{
        db = defaultData();
        await syncRemote();
      }
      save();
    }catch(e){
      console.error('remote load failed, fallback to localStorage:', e);
      db = load();
    }
  }

  function exportJSON(){
    var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
    var a=document.createElement("a");

    URL.revokeObjectURL(a.href);
  }
  function mdEsc(s){ return String(s==null?"":s).replace(/\|/g,"\\|").replace(/\n/g," "); }
  function exportMarkdown(){
    var pad=function(n){ return String(n).padStart(2,"0"); };
    var now=new Date();
    var stamp=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes());
    var L=[];
    L.push("# 饮品热量清单","");
    L.push("> 导出时间："+stamp+"　热量单位：大卡（kcal）","");

    L.push("## 一、配料库","");
    L.push("| 配料 | 类别 | 单位 | 基准量 | 基准千焦 | 每单位大卡 | 备注 |");
    L.push("|---|---|---|---|---|---|---|");
    db.ings.forEach(function(i){
      L.push("| "+mdEsc(i.name)+" | "+mdEsc(i.category)+" | "+i.unit+" | "+(+i.base||100)+" | "+(+i.kJ||0)+" | "+r1(kcalPerUnit(i))+" | "+mdEsc(i.note||"")+" |");
    });
    L.push("");

    L.push("## 二、饮品配方","");
    BIG_CATS.forEach(function(big){
      var list=db.products.filter(function(p){return p.big===big;});
      if(!list.length) return;
      L.push("### "+big,"");
      list.forEach(function(p){
        var c=productKcal(p, defaultMilk(p));
        var t=tier(c.total,p.big);
        var price=(p.price!=null&&p.price!=="")?("¥"+p.price):"未定价";
        var size=p.size||"杯型未标注";
        L.push("#### "+mdEsc(p.name)+"（"+size+" · "+price+" · "+r1(c.total)+" 大卡 · "+t.label+"）","");
        L.push("| 配料 | 用量 | 大卡 | 占比 |");
        L.push("|---|---|---|---|");
        c.rows.forEach(function(r){
          if(r.missing){ L.push("| 配料缺失（"+mdEsc(r.ingId)+"） | "+r.qty+" | — | — |"); return; }
          var pct=c.total>0?Math.round(r.kcal/c.total*100):0;
          L.push("| "+mdEsc(r.ing.name)+" | "+r.qty+mdEsc(r.ing.unit)+(r.role==="milk"?"（牛奶位）":"")+" | "+r1(r.kcal)+" | "+pct+"% |");
        });
        L.push("");
      });
    });

    var blob=new Blob([L.join("\n")],{type:"text/markdown;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="饮品热量清单.md";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  }
  function importJSON(file){
    if(!file) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var d=JSON.parse(reader.result);
        if(!d.ings||!d.products) throw new Error("bad");
        db=d; save(); syncRemote(); render(); alert("导入成功");
      }catch(e){ alert("文件格式不正确，请选择本系统导出的 JSON"); }
    };
    reader.readAsText(file);
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
  function r1(n){ return Math.round((+n||0)*10)/10; }
  function byId(arr,id){ return arr.find(function(x){return x.id===id;}); }
  function ing(id){ return byId(db.ings,id); }
  function kcalPerUnit(i){ if(!i) return 0; return (+i.kJ||0)/KJ/(+i.base||100); }

  /* ---------- 内联线稿图标（纯代码兜底，无外部素材） ---------- */

  function ingIcon(i){
    if(!i) return "bean";

  }

  function productKcal(p, milkId){
    var total=0, rows=[];
    p.items.forEach(function(it){
      var iid = it.role==="milk" ? (milkId||it.ingId) : it.ingId;
      var i = ing(iid);
      if(!i){ rows.push({missing:true, ingId:iid, qty:+it.qty||0, role:it.role, kcal:0}); return; }
      var k = kcalPerUnit(i) * (+it.qty||0);
      total += k;
      rows.push({ing:i, qty:+it.qty||0, role:it.role, kcal:k});
    });
    return { total:total, rows:rows };
  }

  async function loadAdminOrders(){

      else{ prompt("复制下面的 SQL 到 Supabase 后台 SQL Editor：",ORDER_SQL); }

      if(ordMock) return;
      if(state.view==="admin" && state.tab==="orders"){ loadAdminOrders().then(function(){ if(state.tab==="orders") renderOrders(); }); }
    },10000);
  }

        name:name, category:document.getElementById("f_cat").value,
        unit:document.getElementById("f_unit").value,
        base:parseFloat(document.getElementById("f_base").value)||100,
        kJ:parseFloat(document.getElementById("f_kj").value)||0,
        note:document.getElementById("f_note").value.trim(),
        image:image
      };
      if(id){ Object.assign(byId(db.ings,id),data); }
      else{ data.id=ingId; db.ings.push(data); }
      save(); syncRemote(); closeModal(); render();
    });
  }

  /* ----- 饮品管理 ----- */
  function cloneProduct(p){
    var c = JSON.parse(JSON.stringify(p));
    c.id = "p"+Date.now();
    c.name = p.name + " 副本";
    c.image = "";  // 副本不共享原图，避免互相删图
    db.products.push(c);
    save(); syncRemote(); render();
  }

  function renderProducts(){
    var body = document.getElementById("adminBody");
    var q = state.prodQuery.trim();
    var list = db.products.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q.toLowerCase())>=0; });
    var rows = list.map(function(p,idx){
      var c = productKcal(p, defaultMilk(p));
      var t = tier(c.total, p.big);
      var milkLabel = p.milkSwitch ? "可换牛奶" : "无牛奶位";
      return '<div class="prod">' +
        '<div class="idx">'+String(idx+1).padStart(2,"0")+'</div>' +
        (p.image?'<img class="prod-thumb" src="'+esc(p.image)+'" alt="">':'<div class="prod-thumb thumb-ic">'+ic(catIcon(p.big))+'</div>') +
        '<div class="prod-body">' +
        '<div class="prod-top"><span class="prod-name">'+esc(p.name)+'<span class="prod-cat">'+esc(p.big)+' · '+milkLabel+(p.size?' · '+esc(p.size):"")+'</span></span></div>' +
        '<div class="prod-meta">'+p.items.length+' 项配料'+(p.milkOptions.length?' · 牛奶候选 '+p.milkOptions.length+' 款':"")+'</div>' +
        '<div class="ing-ops"><button class="btn sm ghost" data-edit-p="'+p.id+'">编辑</button>' +
        '<button class="btn sm ghost" data-copy-p="'+p.id+'">复制</button>' +
        '<button class="btn sm danger" data-del-p="'+p.id+'">删除</button></div>' +
        '</div>' +
        '<div class="kblock"><span class="prod-kcal">'+r1(c.total)+'<small> 大卡</small></span>' +
        ruler(c.total,0,300) + '<span class="tag '+t.cls+'">'+t.label+'</span>' +
        (p.price!=null&&p.price!==""?'<span class="price">¥'+p.price+'</span>':'')+'</div></div>';
    }).join("");

    body.innerHTML =
      '<div class="toolbar">' +
        '<input type="search" id="prodSearch" class="search" placeholder="搜索饮品名称…" value="'+esc(state.prodQuery)+'">' +
        '<button class="btn" id="addProdBtn">＋ 新增饮品</button>' +
      '</div>' +
      '<div class="legend">右侧刻度 = 整杯热量（0–300 大卡）</div>' +
      '<div class="prod-list">'+(rows||'<div class="empty">没有匹配的饮品</div>')+'</div>';

    document.getElementById("prodSearch").addEventListener("input",function(e){ state.prodQuery=e.target.value; renderProducts(); var s=document.getElementById("prodSearch"); s.focus(); s.setSelectionRange(s.value.length,s.value.length); });
    document.getElementById("addProdBtn").addEventListener("click",function(){ openProductModal(null); });
    body.querySelectorAll("[data-edit-p]").forEach(function(b){ b.addEventListener("click",function(){ openProductModal(b.dataset.editP); }); });
    body.querySelectorAll("[data-copy-p]").forEach(function(b){ b.addEventListener("click",function(){ cloneProduct(byId(db.products,b.dataset.copyP)); }); });
    body.querySelectorAll("[data-del-p]").forEach(function(b){ b.addEventListener("click",function(){
      var target=byId(db.products,b.dataset.delP);
      if(confirm("删除该饮品？")){
        db.products=db.products.filter(function(x){return x.id!==b.dataset.delP;});
        save(); syncRemote(); render();
        if(target && target.image) deleteProductImage(target.image);
      }
    }); });
  }

  function milkIngs(){ return db.ings.filter(function(i){return i.category==="牛奶";}); }
  function quickQty(cat){
    if(cat==="牛奶") return [180,280,360];
    if(cat==="糖浆"||cat==="风味酱"||cat==="果酱") return [10,15,20];
    if(cat==="基底") return [200,300];
    if(cat==="小料"||cat==="顶料") return [5,10];
    return [10,20];
  }

  function openProductModal(id){
    var p = id ? byId(db.products,id) : {name:"",big:"咖啡",milkSwitch:true,milkOptions:[],items:[{ingId:"",qty:0,role:"other"}],desc:"",price:"",size:"",image:""};
    state.modal={type:"product",id:id};

    var milkOpts = milkIngs();
    var milkRow = p.items.find(function(x){return x.role==="milk";}) || {ingId:milkOpts[0]?milkOpts[0].id:"",qty:0};
    var otherRows = p.items.filter(function(x){return x.role!=="milk";});
    var checked = new Set((p.milkOptions && p.milkOptions.length) ? p.milkOptions : (milkOpts[0]?[milkOpts[0].id]:[]));

    function ingOptions(sel){
      return '<option value="">选择配料</option>' + db.ings.map(function(i){return '<option value="'+i.id+'"'+(i.id===sel?"selected":"")+'>'+esc(i.name)+'（'+esc(i.category)+'）</option>';}).join("");
    }

    function otherRowHtml(row, idx){
      var i = ing(row.ingId);
      var unit = i ? i.unit : "";
      var chips = quickQty(i?i.category:"").map(function(q){return '<button type="button" class="qty-chip" data-q="'+q+'">'+q+'</button>';}).join("");
      return '<div class="ing-row-edit" data-idx="'+idx+'">' +
        '<div class="row2">' +
          '<div class="field"><label>配料</label><select data-oidx="'+idx+'">'+ingOptions(row.ingId)+'</select></div>' +
          '<div class="field"><label>用量'+(unit?'（'+esc(unit)+'）':'')+'</label><input type="number" data-qidx="'+idx+'" min="0" step="1" value="'+esc(row.qty)+'"></div>' +
        '</div>' +
        '<div class="qty-chips">'+chips+'</div>' +
        '<button class="btn sm danger" data-del-row="'+idx+'">移除</button></div>';
    }

    document.getElementById("modal").innerHTML =
      '<h2>'+(id?"编辑饮品":"新增饮品")+'</h2>' +
      '<div class="field"><label>饮品名称</label><input id="p_name" value="'+esc(p.name)+'"></div>' +
      '<div class="row2">' +
        '<div class="field"><label>大分类</label><select id="p_big">'+BIG_CATS.map(function(c){return '<option '+(p.big===c?"selected":"")+'>'+c+'</option>';}).join("")+'</select></div>' +
        '<div class="field"><label>牛奶可切换</label><select id="p_milkSwitch"><option value="1"'+(p.milkSwitch?"selected":"")+'>是（咖啡）</option><option value="0"'+(!p.milkSwitch?"selected":"")+'>否</option></select></div>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="field"><label>售价（元）</label><input type="number" id="p_price" min="0" step="0.5" value="'+esc(p.price)+'"></div>' +
        '<div class="field"><label>杯型</label><select id="p_size">' +
          '<option value=""'+(p.size===""?"selected":"")+'>不标注</option>' +
          '<option value="小杯"'+(p.size==="小杯"?"selected":"")+'>小杯</option>' +
          '<option value="中杯"'+(p.size==="中杯"?"selected":"")+'>中杯</option>' +
          '<option value="大杯"'+(p.size==="大杯"?"selected":"")+'>大杯</option>' +
        '</select></div>' +
      '</div>' +
      '<div class="field"><label>饮品图片</label>' +
        '<div class="img-uploader">' +
          '<img class="img-preview" id="p_imgPreview" src="'+esc(p.image||"")+'" style="'+(p.image?"":"display:none")+'">' +
          '<div class="img-ops">' +
            '<input type="file" id="p_imgFile" accept="image/*" style="display:none">' +
            '<button type="button" class="btn sm ghost" id="p_imgPick">选择图片</button>' +
            '<button type="button" class="btn sm danger" id="p_imgRemove" style="'+(p.image?"":"display:none")+'">移除图片</button>' +
            '<span class="img-hint">建议成品图，前端自动压缩后上传</span>' +
          '</div>' +
        '</div></div>' +
      '<div class="field" id="milkBlock"><label>候选牛奶（勾选可切换款）</label>' +
        '<div class="check-list" id="milkChecks">'+milkOpts.map(function(m){
          return '<label class="check-row"><input type="checkbox" data-mid="'+m.id+'"'+(checked.has(m.id)?" checked":"")+'> '+esc(m.name)+'</label>';
        }).join("")+'</div>' +
        '<div class="row2" style="margin-top:10px">' +
          '<div class="field"><label>默认牛奶位</label><select id="p_milk"></select></div>' +
          '<div class="field"><label>牛奶用量（ml）</label><input type="number" id="p_milkQty" min="0" step="1" value="'+esc(milkRow.qty)+'"></div>' +
        '</div>' +
        '<div class="qty-chips" id="milkChips">'+[180,280,360].map(function(q){return '<button type="button" class="qty-chip" data-q="'+q+'">'+q+'</button>';}).join("")+'</div></div>' +
      '<div class="field"><label>其他配料</label><div id="otherRows">'+otherRows.map(otherRowHtml).join("")+'</div>' +
        '<button class="btn sm ghost" id="addRow" style="margin-top:6px">＋ 添加配料</button></div>' +
      '<div class="btn-row"><button class="btn" id="saveProd">保存</button><button class="btn ghost" id="closeModal">取消</button></div>';

    document.getElementById("overlay").classList.add("open");
    document.getElementById("closeModal").addEventListener("click",closeModal);

    var milkBlock=document.getElementById("milkBlock");
    var switchSel=document.getElementById("p_milkSwitch");
    function syncMilkBlock(){ milkBlock.style.display = switchSel.value==="1" ? "" : "none"; }
    switchSel.addEventListener("change",syncMilkBlock);
    syncMilkBlock();

    function refreshMilkSelect(){
      var sel=document.getElementById("p_milk");
      var chosen=milkOpts.filter(function(m){return checked.has(m.id);});
      var cur=sel.value;
      sel.innerHTML=chosen.map(function(m){return '<option value="'+m.id+'"'+(m.id===cur?"selected":"")+'>'+esc(m.name)+'</option>';}).join("");
      if(!checked.has(cur) && chosen.length) sel.value=chosen[0].id;
    }
    document.getElementById("milkChecks").querySelectorAll("input[data-mid]").forEach(function(cb){
      cb.addEventListener("change",function(){
        if(cb.checked) checked.add(cb.dataset.mid); else checked.delete(cb.dataset.mid);
        refreshMilkSelect();
      });
    });
    refreshMilkSelect();
    document.getElementById("milkChips").querySelectorAll(".qty-chip").forEach(function(ch){
      ch.addEventListener("click",function(){ document.getElementById("p_milkQty").value=ch.dataset.q; });
    });

    /* 饮品图片状态：current=原有图，blob/dataUrl=本次新选，removed=已移除 */
    var imgState = { current:p.image||"", blob:null, dataUrl:"", removed:false };
    var imgPreview=document.getElementById("p_imgPreview");
    var imgPick=document.getElementById("p_imgPick");
    var imgRemove=document.getElementById("p_imgRemove");
    var imgFile=document.getElementById("p_imgFile");
    function renderImgPreview(){
      var shown = imgState.removed ? "" : (imgState.dataUrl || imgState.current);
      if(shown){ imgPreview.src=shown; imgPreview.style.display=""; imgRemove.style.display=""; }
      else{ imgPreview.style.display="none"; imgRemove.style.display="none"; }
    }
    imgPick.addEventListener("click",function(){ imgFile.click(); });
    imgFile.addEventListener("change",async function(){
      var f=imgFile.files && imgFile.files[0];
      if(!f) return;
      try{
        var r=await compressImage(f);
        imgState.blob=r.blob; imgState.dataUrl=r.dataUrl; imgState.removed=false;
        renderImgPreview();
      }catch(e){ alert(e.message||"图片处理失败"); }
      imgFile.value="";
    });
    imgRemove.addEventListener("click",function(){
      imgState.blob=null; imgState.dataUrl=""; imgState.removed=true; renderImgPreview();
    });
    renderImgPreview();

    var otherState = otherRows.slice();

    function rebindRows(){
      var box=document.getElementById("otherRows");
      box.innerHTML = otherState.map(function(r,idx){return otherRowHtml(r,idx);}).join("");
      box.querySelectorAll("[data-del-row]").forEach(function(b){ b.addEventListener("click",function(){ otherState.splice(+b.dataset.delRow,1); rebindRows(); }); });
      box.querySelectorAll("[data-oidx]").forEach(function(s){ s.addEventListener("change",function(){ otherState[+s.dataset.oidx].ingId=s.value; rebindRows(); }); });
      box.querySelectorAll("[data-qidx]").forEach(function(inp){ inp.addEventListener("input",function(){ otherState[+inp.dataset.qidx].qty=parseFloat(inp.value)||0; }); });
      box.querySelectorAll(".qty-chip").forEach(function(ch){ ch.addEventListener("click",function(){
        var row=ch.closest(".ing-row-edit"); var idx=+row.dataset.idx;
        otherState[idx].qty=parseFloat(ch.dataset.q)||0;
        row.querySelector("[data-qidx]").value=ch.dataset.q;
      }); });
    }
    rebindRows();
    document.getElementById("addRow").addEventListener("click",function(){ otherState.push({ingId:"",qty:0,role:"other"}); rebindRows(); });

    var saveBtn=document.getElementById("saveProd");
    function setSaving(on){ saveBtn.disabled=on; saveBtn.textContent=on?"上传中…":"保存"; }
    saveBtn.addEventListener("click",async function(){
      var name=document.getElementById("p_name").value.trim();
      if(!name){ alert("请填写饮品名称"); return; }
      var milkSwitch=document.getElementById("p_milkSwitch").value==="1";
      var milkId=document.getElementById("p_milk").value;
      var milkQty=parseFloat(document.getElementById("p_milkQty").value)||0;
      var items=[];
      if(milkSwitch && milkId) items.push({ingId:milkId,qty:milkQty,role:"milk"});
      otherState.forEach(function(r){ if(r.ingId) items.push({ingId:r.ingId,qty:r.qty||0,role:"other"}); });
      var priceVal=document.getElementById("p_price").value.trim();
      var prodId = id || ("p"+Date.now());

      var oldImage = imgState.current;
      var image = oldImage;
      if(imgState.removed){
        image="";
        deleteProductImage(oldImage);
      } else if(imgState.blob){
        if(supaReady()){
          setSaving(true);
          try{ image = await uploadImage(imgState.blob, "prod", prodId); }
          catch(e){ setSaving(false); alert("图片上传失败，未保存："+((e&&e.message)||e)); return; }
          setSaving(false);
          deleteProductImage(oldImage);  // 新图上传成功后再删旧图
        } else {
          image = imgState.dataUrl;
        }
      }

      var data={
        name:name, big:document.getElementById("p_big").value, milkSwitch:milkSwitch,
        milkOptions:milkSwitch?Array.from(checked):[],
        items:items, desc:"",
        price:priceVal===""?"":Number(priceVal), size:document.getElementById("p_size").value,
        image:image
      };
      if(id){ Object.assign(byId(db.products,id),data); }
      else{ data.id=prodId; db.products.push(data); }
      save(); syncRemote(); closeModal(); render();
    });
  }

  function closeModal(){ state.modal=null; document.getElementById("overlay").classList.remove("open"); }
  document.getElementById("overlay").addEventListener("click",function(e){ if(e.target===this) closeModal(); });

  function renderLanding(){
    var prods = db.products.slice(0,3);
    var cards = prods.map(function(p){
      var c=productKcal(p,defaultMilk(p));
      return '<div class="landing-card" data-p="'+p.id+'">' +
        (p.image?'<img class="lc-img" src="'+esc(p.image)+'" alt="">':'<div class="lc-img thumb-ic">'+ic(catIcon(p.big))+'</div>') +
        '<div class="lc-body"><div class="lc-name">'+esc(p.name)+'<span class="prod-cat">'+esc(p.big)+'</span></div>' +
        '<div class="lc-meta"><span class="m">'+r1(c.total)+' 大卡 · '+p.items.length+' 项配料</span>' +
        (p.price!=null&&p.price!==""?'<span class="price">¥'+p.price+'</span>':'')+'</div></div></div>';
    }).join("");
    var html =
      '<section class="hero">' +
        '<img class="hero-bg" src="'+HERO_SRC+'" alt="">' +
        '<div class="hero-shade"></div>' +
        '<div class="wrap hero-in">' +
        '<div class="hero-text">' +
        '<div class="hero-kicker">COFFEE MENU · 热量透明</div>' +
        '<h2>每一杯的热量，<br>都看得见。</h2>' +
        '<p>从浓缩、牛奶到糖浆，逐项配料拆给你看；咖啡可切换牛奶版本，点单前先知道这一杯多少大卡。</p>' +
        '<div class="hero-actions">' +
          '<button class="btn" data-go="shop">浏览菜单</button>' +
          '<button class="btn ghost" data-go="admin">商家入口</button>' +
        '</div>' +
        '</div>' +
        '<div class="hero-scale"><span class="hero-scap">SCALE · KCAL</span><div class="rail"></div>' +
          [0,50,100,150,200,250,300].map(function(v){
            var pct=v/300*100;
            return '<div class="tick" data-p="'+pct+'" style="left:'+pct+'%"><i></i><em>'+v+(v===300?' 大卡':'')+'</em></div>';
          }).join('') +
          '<div class="mark"><i></i><b>122.2 · 澳白</b></div>' +
        '</div>' +
        '<div class="hero-stats">' +
          '<div class="hs"><b>'+db.products.length+'</b><span>款饮品</span></div>' +
          '<div class="hs"><b>'+db.ings.length+'</b><span>项配料</span></div>' +
          '<div class="hs"><b>4</b><span>条热量档位</span></div>' +
        '</div>' +
        '</div>' +
      '</section>' +
      '<div class="wrap">' +
        '<section class="landing-section"><h3>今日菜单</h3><p class="ls-sub">点击任意饮品查看配料构成与热量拆分。</p>' +
          '<div class="landing-grid">'+(cards||'<div class="empty">暂无饮品</div>')+'</div></section>' +
        '<section class="landing-section"><div class="landing-feats">' +
          '<div class="feat"><div class="feat-ic">'+ic('shield')+'</div><b>热量透明</b><span>按配料用量逐项计算，大卡与千焦可核对。</span></div>' +
          '<div class="feat"><div class="feat-ic">'+ic('list')+'</div><b>配方可溯</b><span>每款饮品的配料、基准量与档位一目了然。</span></div>' +
          '<div class="feat"><div class="feat-ic">'+ic('drop')+'</div><b>牛奶可换</b><span>咖啡支持切换牛奶版本，热量随之更新。</span></div>' +
        '</div></section>' +
        '<div class="landing-foot">饮品热量管理系统 · 数据来自本店配料库与配方</div>' +
      '</div>';
    app.innerHTML=html;
    app.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ state.view=b.dataset.go; state.selProduct=null; render(); }); });
    app.querySelectorAll(".landing-card").forEach(function(c){ c.addEventListener("click",function(){ state.view="shop"; state.selProduct=c.dataset.p; render(); }); });
  }

  function renderShop(){
    var html='<div class="wrap">';
    html += '<h1 class="page-title">菜单</h1><p class="page-sub">选择大类，查看每款饮品的热量与配料构成；咖啡可切换牛奶版本。</p>';
    html += '<div class="chips">'+BIG_CATS.map(function(c){return '<button class="chip '+(state.shopCat===c?"active":"")+'" data-sc="'+c+'">'+c+'</button>';}).join("")+'</div>';
    html += '<div class="chips">'+HEAT_FILTERS.map(function(f){return '<button class="chip '+(state.heatFilter===f[0]?"active":"")+'" data-heat="'+f[0]+'">'+f[1]+'</button>';}).join("")+'</div>';
    html += '<div class="toolbar"><input type="search" id="shopSearch" class="search" placeholder="搜索饮品名称…" value="'+esc(state.shopQuery)+'"></div>';

    if(!state.selProduct){
      var sq = state.shopQuery.trim().toLowerCase();
      var list = db.products.filter(function(p){
          var qOk = !sq || p.name.toLowerCase().indexOf(sq)>=0;
          return p.big===state.shopCat && qOk && inHeat(productKcal(p,defaultMilk(p)).total, state.heatFilter);
        })
        .sort(function(a,b){ return productKcal(a,defaultMilk(a)).total - productKcal(b,defaultMilk(b)).total; });
      var cards = list.map(function(p,idx){
        var c=productKcal(p,defaultMilk(p)); var t=tier(c.total,p.big);
        var milkTxt = p.milkSwitch ? " · 可换牛奶" : "";
        return '<div class="shop-card" data-p="'+p.id+'">' +
          (p.image?'<img class="shop-thumb" src="'+esc(p.image)+'" alt="">':'<div class="shop-thumb thumb-ic">'+ic(catIcon(p.big))+'</div>') +
          '<div class="prod-body">' +
          '<div class="prod-top"><span class="prod-name">'+esc(p.name)+'<span class="prod-cat">'+esc(p.big)+milkTxt+(p.size?' · '+esc(p.size):"")+'</span></span></div>' +
          '<div class="shop-meta">'+(p.price!=null&&p.price!==""?'<span class="price">¥'+p.price+'</span> · ':"")+p.items.length+' 项配料</div>' +
          '</div>' +
          '<div class="kblock"><span class="prod-kcal">'+r1(c.total)+'</span>' +
          '<span class="tag '+t.cls+'">'+t.label+'</span>'+ruler(c.total,0,300)+'<span class="rtxt">大卡</span>' + '</div></div>';
      }).join("");
      var emptyTxt = sq ? ('没有匹配「'+esc(state.shopQuery.trim())+'」的饮品') : '该分类暂无饮品';
      html += '<div class="shop-grid">'+(cards||'<div class="empty">'+emptyTxt+'</div>')+'</div>';
      html += '</div>';
      app.innerHTML=html;
      app.querySelectorAll(".chip").forEach(function(c){c.addEventListener("click",function(){
        if(c.dataset.sc) state.shopCat=c.dataset.sc;
        if(c.dataset.heat) state.heatFilter=c.dataset.heat;
        state.selProduct=null; render();
      });});
      var ss=document.getElementById("shopSearch");
      if(ss) ss.addEventListener("input",function(e){ state.shopQuery=e.target.value; renderShop(); var s=document.getElementById("shopSearch"); s.focus(); s.setSelectionRange(s.value.length,s.value.length); });
      app.querySelectorAll(".shop-card").forEach(function(c){c.addEventListener("click",function(){state.selProduct=c.dataset.p;render();});});
    } else {
      renderDetail();
    }
  }

  function renderDetail(){
    var p=byId(db.products,state.selProduct);
    if(!p){ state.selProduct=null; renderShop(); return; }
    var milkId=defaultMilk(p);
    var c=productKcal(p,milkId); var t=tier(c.total,p.big);

    var milkSwitchHtml="";
    if(p.milkSwitch){
      var opts=p.milkOptions.map(function(mid){ var m=ing(mid); if(!m) return "";
        return '<button class="chip '+(milkId===mid?"active":"")+'" data-milk="'+mid+'">'+esc(m.name)+'</button>';}).join("");
      milkSwitchHtml='<div class="field"><label>选择牛奶</label><div class="milk-switch">'+opts+'</div></div>';
    }

    var rows=c.rows.map(function(r){
      if(r.missing){
        return '<div class="split-row"><span><span class="s-name">配料缺失</span><br><span class="s-meta">原配料已被删除，请在后台补全</span></span>' +
          '<span class="s-kcal">—</span></div>';
      }
      var pct = c.total>0 ? Math.round(r.kcal/c.total*100) : 0;
      var thumb = r.ing.image ? '<img class="s-thumb" src="'+esc(r.ing.image)+'" alt="">' : '<div class="s-thumb thumb-ic">'+ic(ingIcon(r.ing))+'</div>';
      return '<div class="split-row"><span class="s-left">'+thumb+'<span><span class="s-name">'+esc(r.ing.name)+'</span><br><span class="s-meta">'+r.qty+esc(r.ing.unit)+(r.role==="milk"?" · 牛奶位":"")+'</span></span></span>' +
        '<span class="s-kcal">'+r1(r.kcal)+' 大卡<br><span class="s-pct">占 '+pct+'%</span></span></div>';
    }).join("");

    app.innerHTML =
      '<div class="wrap">' +
      '<div class="detail-head"><button class="back" id="backBtn">← 返回</button></div>' +
      '<div class="card detail-card">' +
        (p.image?'<img class="detail-img" src="'+esc(p.image)+'" alt="">':'<div class="detail-img thumb-ic">'+ic(catIcon(p.big))+'</div>') +
        '<div class="prod-top"><span class="prod-name" style="font-size:19px">'+esc(p.name)+'<span class="prod-cat">'+esc(p.big)+(p.size?' · '+esc(p.size):"")+'</span></span>' +
        '<span>'+(p.price!=null&&p.price!==""?'<span class="price" style="margin-right:8px">¥'+p.price+'</span>':"")+'<span class="tag '+t.cls+'">'+t.label+'</span></span></div>' +
        milkSwitchHtml +
        '<div class="split-list">'+rows+'</div>' +
        '<div class="total-bar"><span>整杯合计</span><span class="big">'+r1(c.total)+' <small>大卡</small></span></div>' +
      '</div></div>';

    document.getElementById("backBtn").addEventListener("click",function(){state.selProduct=null;render();});
    app.querySelectorAll("[data-milk]").forEach(function(b){ b.addEventListener("click",function(){ state.milkSel[p.id]=b.dataset.milk; render(); }); });
  }

  /* ---------- 视图切换 ---------- */
  document.getElementById("viewSwitch").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){ state.view=b.dataset.view; state.selProduct=null; render(); });
  });

  app.innerHTML = '<div class="empty" style="padding:80px 0">加载中…</div>';
  boot().then(function(){ render(); }).catch(function(){ render(); });
})();
</script>
</body>
</html>
