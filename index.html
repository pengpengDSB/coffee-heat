<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>精品咖啡</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Archivo:wght@300;400;500&display=swap">
<style>
  :root{
    --paper:#FCFCFA;
    --ink:#141410;
    --ink-2:#3D3C36;
    --gray:#6E6C63;
    --gray-2:#8C8A80;
    --line:#E2DFD4;
    --line-2:#EDEAE1;
    --brown:#7A4E33;
    --dark:#181510;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#EFEEEA;color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .phone{max-width:420px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative}
  @media(min-width:481px){
    body{padding:24px 0}
    .phone{border-radius:4px;min-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.14)}
  }
  .num{font-family:"Archivo","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}

  .top{display:flex;justify-content:space-between;align-items:center;padding:24px 22px 0;font-size:10px;letter-spacing:.26em}
  .top .r{color:var(--gray-2);letter-spacing:.18em}

  .hd{padding:30px 22px 0;display:flex;justify-content:space-between;align-items:baseline}
  .hd h1{font-size:12.5px;font-weight:500;letter-spacing:.22em}
  .hd span{font-size:10px;color:var(--gray);letter-spacing:.06em}

  /* ---------- 刻度 ---------- */
  .ruler{position:relative;margin:10px 22px 0;height:100px;border-bottom:2px solid var(--ink);touch-action:none}
  .axis{position:absolute;left:0;right:0;bottom:25px;height:1px;background:var(--ink)}
  .tick{position:absolute;bottom:25px;width:1px;background:#D5D2C7}
  .tick.major{height:11px;background:var(--ink)}
  .tick.minor{height:6px}
  .lab{position:absolute;bottom:5px;font-size:10px;color:var(--gray);transform:translateX(-50%);letter-spacing:.02em}
  .band-strip{position:absolute;bottom:25px;height:4px;background:var(--ink)}
  .mk{position:absolute;transform:translateX(-50%);cursor:pointer;padding:0;background:none;border:none}
  .mk .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin:0 auto}
  .mk .tag{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:12.5px;color:var(--brown);letter-spacing:.02em;font-family:Archivo,sans-serif;font-weight:500}
  .mk.sel .dot{width:11px;height:11px;background:var(--brown)}
  .mk.sel .stem{display:block;width:1px;height:18px;background:var(--brown);margin:0 auto}

  /* ---------- 选中卡 ---------- */
  .card{display:flex;gap:16px;align-items:flex-start;margin:24px 22px 0}
  .thumb{width:150px;height:190px;overflow:hidden;background:#EFEDE6;flex:none;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;
    font-size:9.5px;color:var(--gray-2);letter-spacing:.1em}
  .tx{flex:1;min-width:0;padding-top:2px}
  .tx .n{font-size:23px;font-weight:300;letter-spacing:.07em;line-height:1.25}
  .tx .s{font-size:10.5px;color:var(--gray);margin-top:6px;letter-spacing:.05em}
  .tx .k{margin-top:20px;display:flex;align-items:baseline;gap:6px}
  .tx .k b{font-size:56px;font-weight:400;letter-spacing:-.02em;line-height:.88}
  .tx .k span{font-size:10.5px;color:var(--gray);letter-spacing:.1em}
  .tx .lv{margin-top:12px;font-size:10px;color:var(--brown);letter-spacing:.12em}
  .tx .go{margin-top:14px;display:inline-block;font-size:10.5px;color:var(--ink);letter-spacing:.1em;
    border-bottom:1px solid var(--ink);padding-bottom:2px}

  .listcap{display:flex;justify-content:space-between;margin:30px 22px 0;font-size:9.5px;color:var(--gray-2);letter-spacing:.14em}
  .list{margin:10px 22px 0;border-top:1px solid var(--line)}
  .li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .li .nm{font-size:11px;letter-spacing:.04em;width:100px;flex:none;color:var(--ink-2);line-height:1.5}
  .li .bar{flex:1;height:1px;background:var(--line);position:relative;margin:0 4px}
  .li .bar i{position:absolute;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
  .li .v{font-size:12px;width:46px;text-align:right;flex:none;font-family:Archivo,sans-serif}
  .li .pr{font-size:11px;color:var(--gray);width:36px;text-align:right;flex:none}
  .foot{margin:22px 22px 0;font-size:9.5px;color:var(--gray-2);line-height:1.95;letter-spacing:.04em}

  /* ---------- 点单：深色筛选带 ---------- */
  .band{background:var(--dark);color:#F4F1E9;padding:26px 22px 22px}
  .band .bhd{display:flex;justify-content:space-between;align-items:baseline}
  .band .bhd h1{font-size:12.5px;font-weight:500;letter-spacing:.22em}
  .band .bhd span{font-size:9.5px;color:rgba(244,241,233,.55);letter-spacing:.14em}
  .tabs{display:flex;gap:22px;margin-top:18px}
  .tabs button{border:none;background:none;font:inherit;font-size:11.5px;color:rgba(244,241,233,.6);
    cursor:pointer;padding:0 0 6px;letter-spacing:.08em}
  .tabs button.on{color:#F4F1E9;font-weight:500;border-bottom:1.5px solid #F4F1E9}
  .heatrow{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:10px;color:rgba(244,241,233,.5);letter-spacing:.06em}
  .heatrow button{border:none;background:none;font:inherit;font-size:10px;color:rgba(244,241,233,.5);cursor:pointer;padding:0;letter-spacing:.06em}
  .heatrow button.on{color:#F4F1E9}
  .heatrow .sep{color:rgba(244,241,233,.28)}

  .searchline{display:flex;align-items:center;gap:9px;margin:20px 22px 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .searchline svg{width:13px;height:13px;color:var(--gray-2);flex:none}
  .searchline input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:12.5px;color:var(--ink);outline:none;letter-spacing:.05em}
  .searchline input::placeholder{color:var(--gray-2);letter-spacing:.12em;font-size:11px}

  .mrows{margin:14px 22px 0}
  .qadd{border:1px solid var(--line);background:none;font:inherit;font-size:9px;letter-spacing:.1em;
    color:var(--ink-2);padding:4px 8px;cursor:pointer;white-space:nowrap;position:relative}
  .qadd:active{border-color:var(--ink)}
  .qadd .dot{position:absolute;top:-7px;right:-7px;min-width:15px;height:15px;line-height:15px;border-radius:8px;
    background:var(--brown);color:#fff;font-size:9px;font-family:Archivo,sans-serif;text-align:center;padding:0 3px}
  .mrow{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line-2);cursor:pointer;align-items:flex-start}
  .mrow .th{width:76px;height:95px;flex:none;overflow:hidden;background:#EFEDE6}
  .mrow .th img{width:100%;height:100%;object-fit:cover;display:block}
  .mrow .in{flex:1;min-width:0}
  .mrow .n{font-size:14px;font-weight:400;letter-spacing:.05em}
  .mrow .s{font-size:10px;color:var(--gray);margin-top:4px;letter-spacing:.04em}
  .mrow .k{font-size:10.5px;color:var(--brown);margin-top:7px;letter-spacing:.06em}
  .mrow .k b{font-family:Archivo,sans-serif;font-weight:500;font-size:12px}
  .mrow .pr{font-size:13px;color:var(--ink-2);flex:none;padding-top:1px;font-family:Archivo,sans-serif;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px}

  /* ---------- 详情：记录卡 ---------- */
  .page{padding:0 22px 104px}
  .dback{display:flex;align-items:center;gap:6px;margin-top:20px;border:none;background:none;font:inherit;
    font-size:10.5px;color:var(--gray);cursor:pointer;letter-spacing:.12em;padding:12px 0}
  .dback svg{width:11px;height:11px}
  .dshot{width:100%;aspect-ratio:1/1.02;overflow:hidden;background:#EFEDE6;margin-top:12px}
  .dshot img{width:100%;height:100%;object-fit:cover;display:block}

  .rec{margin-top:22px}
  .rec .r1{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;letter-spacing:.2em;color:var(--gray)}
  .rec h1{font-size:26px;font-weight:300;letter-spacing:.08em;margin-top:8px;line-height:1.2}
  .rec .en{font-family:Archivo,sans-serif;font-size:9px;letter-spacing:.22em;color:var(--gray);margin-top:3px}
  .rec .double{height:3px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:14px}
  .meta{display:grid;grid-template-columns:1fr 1fr;margin-top:2px}
  .meta div{padding:10px 0;border-bottom:1px solid var(--line);font-size:10.5px;display:flex;justify-content:space-between;padding-right:14px}
  .meta div:nth-child(2n){padding-right:0;padding-left:14px;border-left:1px solid var(--line)}
  .meta div span{color:var(--gray);letter-spacing:.1em}
  .meta div b{font-weight:400;letter-spacing:.04em}

  .blk{margin-top:24px}
  .blk .lb{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:7px;border-bottom:1px solid var(--ink)}
  .blk .lb b{font-size:10px;font-weight:500;letter-spacing:.18em}
  .blk .lb span{font-size:9px;color:var(--gray);letter-spacing:.06em}
  .milks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .milks button{border:1px solid var(--line);background:none;font:inherit;font-size:11px;color:var(--ink-2);
    padding:12px 15px;cursor:pointer;letter-spacing:.04em}
  .milks button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .milks button:disabled{color:var(--gray-2);border-color:var(--line-2);cursor:default}
  .milks button i{font-style:normal;font-size:8.5px;margin-left:4px;letter-spacing:0}
  .gapnote{font-size:9.5px;color:var(--gray-2);margin-top:9px;letter-spacing:.03em}

  .tbl{width:100%;border-collapse:collapse;margin-top:2px}
  .tbl tr{border-bottom:1px solid var(--line-2)}
  .tbl td{padding:12px 0;font-size:12px;letter-spacing:.03em;vertical-align:baseline}
  .tbl td.u{text-align:right;color:var(--gray);font-size:9.5px;width:58px}
  .tbl td.c{text-align:right;color:var(--brown);font-size:11.5px;width:62px;font-family:Archivo,sans-serif}
  .tbl td.c.miss{color:var(--gray-2)}
  .totrow{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--ink);padding-top:14px;margin-top:2px}
  .totrow .l{font-size:10px;letter-spacing:.14em;color:var(--gray);padding-bottom:5px}
  .totrow .r b{font-size:34px;font-weight:300;letter-spacing:-.01em;font-family:Archivo,sans-serif}
  .totrow .r em{font-style:normal;font-size:9.5px;color:var(--gray);letter-spacing:.1em;margin-left:4px}

  /* ---------- 我的 ---------- */
  .mehead{padding:44px 0 0}
  .mehead h1{font-size:27px;font-weight:300;letter-spacing:.05em;line-height:1.5}
  .mehead p{font-size:11px;color:var(--gray);margin-top:12px;letter-spacing:.06em}
  .mestats{display:flex;margin-top:32px;border-top:1px solid var(--ink)}
  .mestats div{flex:1;padding:16px 0 0;border-right:1px solid var(--line)}
  .mestats div:last-child{border-right:none}
  .mestats b{display:block;font-size:30px;font-weight:400;line-height:34px;height:34px;font-family:"Archivo","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums}
  .mestats span{display:block;font-size:9.5px;color:var(--gray);margin-top:8px;letter-spacing:.1em}
  .melist{margin-top:30px}
  .merow{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;
    background:none;border:none;border-bottom:1px solid var(--line-2);font:inherit;padding:16px 0;cursor:pointer;text-align:left}
  .merow .t b{display:block;font-size:12.5px;font-weight:400;letter-spacing:.06em}
  .merow .t span{display:block;font-size:10.5px;color:var(--gray);margin-top:4px;letter-spacing:.03em}
  .merow .go{color:var(--gray-2)}
  .merow .go svg{width:11px;height:11px}

  .subhead{margin-top:20px}
  .subhead h1{font-size:23px;font-weight:300;letter-spacing:.06em}
  .subbody{margin-top:18px}
  .subbody p{font-size:11.5px;color:var(--gray);line-height:2;margin-top:8px;letter-spacing:.02em}

  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;
    background:rgba(252,252,250,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:15px 0 20px}
  .tb{border:none;background:none;font:inherit;font-size:11.5px;letter-spacing:.2em;color:var(--gray-2);cursor:pointer;padding:4px 14px}
  .tb.on{color:var(--ink);font-weight:500}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .anim{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
  @media(prefers-reduced-motion:reduce){.anim{animation:none}}

  /* === 首页 v8：hero + 可拖刻度 + 三杯推荐 === */
  .hero{position:relative;height:306px;overflow:hidden;background:#1B1917}
  .hbrand{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px;
    font-size:9px;letter-spacing:.24em;color:rgba(255,255,255,.8)}
  .hmedia{position:absolute;inset:0}
  .hmedia img{width:100%;height:100%;object-fit:cover;display:block}
  .hscrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,14,12,.28) 0%,rgba(16,14,12,0) 34%,rgba(16,14,12,.72) 100%)}
  .hero .hmeta{position:absolute;left:22px;bottom:74px;color:#FFF}
  .hname{font-size:26px;font-weight:300;letter-spacing:.09em;line-height:1.2;text-shadow:0 1px 12px rgba(0,0,0,.45)}
  .hsub{font-size:10.5px;color:rgba(255,255,255,.82);margin-top:6px;letter-spacing:.06em}
  .hval{position:absolute;left:22px;bottom:26px;display:flex;align-items:baseline;gap:7px;color:#FFF}
  .hval b{font-size:56px;font-weight:400;line-height:.9;font-family:Archivo,sans-serif;letter-spacing:-.01em}
  .hval span{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.8)}
  .hval em{font-style:normal;font-size:10px;letter-spacing:.1em;color:#FFF;border:1px solid rgba(255,255,255,.45);padding:3px 7px;margin-left:4px}
  .hgo{position:absolute;right:22px;bottom:30px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.7);
    color:#FFF;font:inherit;font-size:10.5px;letter-spacing:.12em;padding:0 0 3px;cursor:pointer}

  .stripwrap{margin-top:22px}
  .striphead{display:flex;justify-content:space-between;margin:0 22px;font-size:10px;color:var(--gray);letter-spacing:.1em}
  .striphint{margin:6px 22px 0;font-size:9.5px;color:var(--gray-2);letter-spacing:.06em}

  .picks{margin-top:26px}
  .pickhead{display:flex;justify-content:space-between;margin:0 22px;font-size:9.5px;color:var(--gray-2);letter-spacing:.14em}
  .pickrow{display:flex;gap:9px;margin:12px 22px 0}
  .pcard{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;font:inherit;cursor:pointer}
  .pth{width:100%;aspect-ratio:1/1.16;overflow:hidden;background:#EFEDE6}
  .pth img{width:100%;height:100%;object-fit:cover;display:block}
  .ptag{font-size:8.5px;color:var(--brown);letter-spacing:.08em;margin-top:8px}
  .pn{font-size:11px;letter-spacing:.03em;margin-top:3px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pk{font-size:8.5px;color:var(--gray);margin-top:3px;letter-spacing:.02em}
  .pk b{font-family:Archivo,sans-serif;font-size:11px;color:var(--ink)}

  /* === 点单：规格 / 购物车 / 结算 / 订单 === */
  .specrow{margin-top:18px}
  .specrow .sl{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;color:var(--gray);
    letter-spacing:.12em;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .specrow .sl b{color:var(--ink);font-weight:500;letter-spacing:.16em}
  .specopts{display:flex;gap:7px;flex-wrap:wrap}
  .specopts button{border:1px solid var(--line);background:none;font:inherit;font-size:11px;color:var(--ink-2);
    padding:9px 14px;cursor:pointer;letter-spacing:.05em}
  .specopts button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .specnote{font-size:9px;color:var(--gray-2);margin-top:10px;letter-spacing:.02em;line-height:1.9}

  /* ---------- 快速选规格（浅半屏） ---------- */
  .qmask{position:fixed;inset:0;background:rgba(20,20,16,.36);z-index:18;display:none}
  .qmask.on{display:block}
  .qsheet{position:fixed;left:50%;bottom:0;width:100%;max-width:420px;z-index:19;background:var(--paper);
    border-top:1px solid var(--ink);padding:16px 22px 20px;transform:translate(-50%,102%);
    transition:transform .28s cubic-bezier(.2,.75,.2,1);max-height:80vh;overflow:auto;-webkit-overflow-scrolling:touch;display:none}
  .qsheet.on{display:block;transform:translate(-50%,0)}
  .qtop{display:flex;gap:13px;align-items:flex-start}
  .qtop .qt{width:84px;height:84px;flex:none;background:#F1EFE7;overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .qtop .qt span{font-size:26px;font-weight:300;color:#C9C4B4;letter-spacing:0}
  .qtop .qt img{width:100%;height:100%;object-fit:cover;display:block}
  .qtop .qmeta{flex:1;min-width:0}
  .qtop .qmeta b{display:block;font-size:14.5px;font-weight:500;letter-spacing:.06em;color:var(--ink)}
  .qtop .qmeta .kk{font-size:10px;color:var(--brown);letter-spacing:.05em;margin-top:7px;font-family:Archivo,sans-serif}
  .qtop .qmeta .qs{font-size:9px;color:var(--gray);letter-spacing:.06em;margin-top:5px}
  .cked{border:none;background:none;font:inherit;font-size:9.5px;color:var(--gray);letter-spacing:.06em;
    cursor:pointer;padding:0 0 0 12px;text-decoration:underline;text-underline-offset:3px}
  .ckerow{display:flex;gap:8px;align-items:flex-start}
  .qh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .qh b{font-size:13.5px;font-weight:500;letter-spacing:.06em}
  .qh .kk{font-size:9.5px;color:var(--brown);letter-spacing:.06em;margin-top:4px}
  .qh button{border:none;background:none;font:inherit;font-size:13px;color:var(--gray);padding:0 2px 6px;cursor:pointer;align-self:flex-start}
  .qmilk{margin-top:18px}
  .qmilk .lb{font-size:9.5px;color:var(--gray);letter-spacing:.16em}
  .qmilk .lb b{color:var(--ink);font-weight:500;margin-right:8px}
  .qbar2{display:flex;align-items:center;gap:10px;margin-top:20px;padding:16px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);
    position:sticky;bottom:0;background:#FCFCFA}
  .qbar2 .qq{display:flex;align-items:center;gap:12px;flex:none}
  .qbar2 .qq button{width:30px;height:30px;border:1px solid var(--line);background:none;font:inherit;
    font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1}
  .qbar2 .qq b{font-family:Archivo,sans-serif;font-size:13px;min-width:12px;text-align:center}
  .qbar2 .go{flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:11px;
    letter-spacing:.12em;padding:12px 0;cursor:pointer}

  .addbar{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:100%;max-width:420px;z-index:12;
    background:var(--dark);color:#F4F1E9;display:flex;align-items:center;justify-content:space-between;
    padding:13px 22px;gap:12px}
  .addbar .qty{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.1em}
  .addbar .qty button{width:26px;height:26px;border:1px solid rgba(244,241,233,.35);background:none;color:#F4F1E9;
    font:inherit;font-size:14px;line-height:1;cursor:pointer}
  .addbar .qty b{font-family:Archivo,sans-serif;font-size:14px;font-weight:400;min-width:14px;text-align:center}
  .addbar .go{border:none;background:#F4F1E9;color:var(--dark);font:inherit;font-size:11.5px;font-weight:500;
    letter-spacing:.12em;padding:11px 18px;cursor:pointer;white-space:nowrap}

  .cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;width:100%;max-width:420px;z-index:11;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:10px}

  function rowToIng(r){ return { id:r.lid, name:r.name, category:r.category, unit:r.unit,

    price:(r.price==null||r.price==="")?"":Number(r.price), size:r.size||"", image:r.image||"" }; }

  function isLocalEnv(){ var h=location.hostname||""; return location.protocol==="file:"||h==="localhost"||h==="127.0.0.1"||h==="::1"||h==="[::1]"; }

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];}); }
  function r1(n){ return Math.round((+n||0)*10)/10; }

  function ing(id){ return byId(db.ings,id); }
  function kcalPerUnit(i){ if(!i) return 0; return (+i.kJ||0)/KJ/(+i.base||100); }
  function tier(k,big){ if(big==="气泡特调") return k<60?"低卡":k<=100?"中卡":"高卡"; return k<225?"低卡":k<=238?"中卡":"高卡"; }
  function inHeat(k,f){ if(f==="全部") return true; if(f==="低") return k<150; if(f==="中") return k>=150&&k<=225; return k>225; }
  function productKcal(p, milkId){
    var total=0, rows=[];
    p.items.forEach(function(it){
      var iid = it.role==="milk" ? (milkId||it.ingId) : it.ingId;
      var i = ing(iid);
      if(!i){ rows.push({missing:true, ingId:iid, qty:+it.qty||0, role:it.role, kcal:0}); return; }
      var k = kcalPerUnit(i)*(+it.qty||0); total+=k;
      rows.push({ing:i, qty:+it.qty||0, role:it.role, kcal:k});
    });
    return { total:total, rows:rows };
  }
  function defaultMilk(p){ return (state.milkSel[p.id]) || (p.milkOptions[0]) || ""; }

    var a=[p.big,p.size].filter(Boolean);

  function scaleMax(){
    var mx=0;
    db.products.forEach(function(p){ mx=Math.max(mx, productKcal(p,defaultMilk(p)).total); });
    return Math.max(200, Math.ceil(mx/20)*20+20);
  }

  function denseRun(){
    var arr=db.products.map(function(p){ return {id:p.id, k:productKcal(p,defaultMilk(p)).total}; })
      .sort(function(a,b){ return a.k-b.k; });
    var best={a:0,b:0,n:0}, cur={a:0,b:0,n:0};
    for(var i=0;i<arr.length;i++){
      if(i===0 || arr[i].k-arr[i-1].k<=18){ cur.b=arr[i].k; cur.n++; }
      else { cur={a:arr[i].k,b:arr[i].k,n:1}; }
      if(cur.n>best.n) best={a:cur.a,b:cur.b,n:cur.n};
    }
    return best;
  }

  function marksLayout(){
    var mx=scaleMax();
    var prods=db.products.slice(0).sort(function(a,b){
      return productKcal(a,defaultMilk(a)).total-productKcal(b,defaultMilk(b)).total;
    });
    var out=[];
    prods.forEach(function(p){
      var k=productKcal(p,defaultMilk(p)).total;
      var x=Math.min(94,Math.max(5,(k/mx)*100));
      var taken={}; out.forEach(function(o){ if(Math.abs(o.x-x)<4.6) taken[o.lvl]=true; });
      var lvl=0; while(taken[lvl]) lvl++;
      out.push({p:p, x:x, lvl:lvl, kcal:k});
    });
    return out;
  }

  function rulerMarks(sel){
    return marksLayout().map(function(o){
      var y=33+o.lvl*10;
      var isSel=o.p.id===sel;
      return '<button class="mk '+(isSel?"sel":"")+'" data-sel="'+o.p.id+'" style="left:'+o.x+'%;bottom:'+y+'px">'+

        (isSel?'<span class="stem"></span>':"")+
        '<span class="dot"></span></button>';
    }).join("");
  }

  function rulerHtml(sel){
    var mx=scaleMax(), ticks='';

      if(major) ticks+='<div class="lab" style="left:'+x+'%">'+v+'</div>';

    var run=denseRun(), band='';
    if(run.n>=3){

    return '<div class="ruler"><div class="axis"></div>'+ticks+band+'<div class="marks">'+rulerMarks(sel)+'</div></div>';

  function bindHome(){
    Array.prototype.forEach.call(app.querySelectorAll(".pcard"),function(el){

      });
    });
    var go=app.querySelector(".hgo");
    if(go) go.addEventListener("click",function(){ state.selProduct=state.selId; render(); });
    var ruler=app.querySelector(".ruler");
    if(!ruler) return;
    var drag=false, mx=scaleMax();
    function at(ev){
      var r=ruler.getBoundingClientRect();
      var x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));
      var kcal=x*mx/100;
      var best=null, bd=1e9;
      db.products.forEach(function(p){
        var k=productKcal(p,defaultMilk(p)).total, d=Math.abs(k-kcal);
        if(d<bd){ bd=d; best=p; }
      });
      if(best && best.id!==state.selId) updateSel(best.id);
    }
    ruler.addEventListener("click",function(e){
      var t=e.target.closest(".mk");
      if(t && !drag) updateSel(t.dataset.sel);
    });
    ruler.addEventListener("pointerdown",function(e){ drag=true; ruler.setPointerCapture(e.pointerId); at(e); });
    ruler.addEventListener("pointermove",function(e){ if(drag) at(e); });
    ruler.addEventListener("pointerup",function(){ setTimeout(function(){ drag=false; },0); });
    ruler.addEventListener("pointercancel",function(){ drag=false; });
  }

      var it=state.cart.filter(function(x){ return x.key===qEditKey; })[0];

  function saveQuickEdit(pid){
    var p=byId(db.products,pid); if(!p) return;
    var cf=detailCfg(p), nk=itemKey(p.id,cf.milkId,cf.sugar,cf.ice);
    var idx=-1;
    state.cart.forEach(function(x,i){ if(x.key===qEditKey) idx=i; });
    var item={key:nk,pid:p.id,name:p.name,price:Number(p.price)||0,kcal:r1(productKcal(p,cf.milkId).total),
      milk:cf.milkId,sugar:cf.sugar,ice:cf.ice,qty:cf.qty};
    var dup=null;
    state.cart.forEach(function(x,i){ if(x.key===nk && i!==idx) dup=x; });
    if(dup){ dup.qty+=cf.qty; if(idx>=0) state.cart.splice(idx,1); }
    else if(idx>=0){ state.cart[idx]=item; }
    saveCart(); state.qty[p.id]=1;
    toast("已更新规格");
    qEditKey=null;
    closeQuick();
    openSheet();

  function renderMeSub(){
    var t={
      about:{t:"热量怎么算",b:["每一项配料都有单位热量，按每 1g 或 1ml 的大卡值记录。","饮品热量 = Σ（单位热量 × 该配料用量）。","换牛奶只替换牛奶位，其余配料保持不变。"],
        rows:[["拿铁 · 全脂奶 280ml","222.0"],["拿铁 · 燕麦奶 280ml","186.4"],["拿铁 · 去糖浆","190.0"]]},
      legend:{t:"热量档位",b:["咖啡类：低于 225 为低卡，225–238 为中卡，高于 238 为高卡。","气泡特调：低于 60 为低卡，60–100 为中卡，高于 100 为高卡。"],
        rows:[["澳白 · 中杯","122.2"],["榛果拿铁 · 中杯","222.0"],["桂花气泡 · 中杯","53.4"]]},
      milk:{t:"牛奶可换",b:["咖啡类饮品都支持换奶，热量随牛奶类型自动重算。","牛奶位按每 1ml 的单位热量换算，具体数值以配料库为准。"],
        rows:[["威士特全脂牛奶","62 / 100ml"],["优诺牛奶","待填"],["悦鲜活牛奶","待填"]]}
    }[state.mePage] || {t:"",b:[],rows:[]};
    app.innerHTML =
      '<div class="page">' +
        '<button class="dback" id="bk">'+IC.back+'返回</button>' +
        '<div class="subhead"><h1>'+esc(t.t)+'</h1></div>' +
        '<div class="subbody">'+t.b.map(function(x){ return '<p>'+esc(x)+'</p>'; }).join("")+'</div>' +
        (t.rows.length?'<div class="blk"><div class="lb"><b>示例</b><span>大卡</span></div><table class="tbl">'+
          t.rows.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td class="u"></td><td class="c">'+esc(r[1])+'</td></tr>'; }).join("")+
          '</table></div>':"") +
      '</div>';
    document.getElementById("bk").addEventListener("click",function(){ state.mePage=null; render(); });
  }

  /* ---------- 购物车条 / 结算 / 订单 ---------- */
  function renderCartBar(){
    var el=document.getElementById("cartbar");
    if(!el) return;
    if(!state.cart.length || state.selProduct || state.viewOrder || state.mePage || state.sheet || qPid){ el.innerHTML=""; return; }
    el.innerHTML='<div class="cartbar"><div class="l"><b>'+cartCount()+'</b>件 · ¥'+money(cartTotal())+' · '+r1(cartKcal())+' 大卡</div>'+
      '<button class="go" id="checkout">去结算</button></div>';
    document.getElementById("checkout").addEventListener("click",function(){ openSheet(); });
  }

  function openSheet(){ state.sheet=true; renderSheet(); }
  function closeSheet(){
    state.sheet=false;
    document.getElementById("mask").classList.remove("on");
    var s=document.getElementById("sheet"); s.classList.remove("on"); s.innerHTML="";
    render();
  }

  function renderSheet(){
    var m=document.getElementById("mask"), s=document.getElementById("sheet");
    if(!m||!s) return;
    m.classList.add("on"); s.classList.add("on");
    var rows=state.cart.map(function(x,i){
      return '<div class="ckerow"><div style="flex:1"><div class="n">'+esc(x.name)+' × '+x.qty+'</div>'+
        '<div class="s">'+esc(specLine(x))+'</div></div>'+
        '<button class="cked" data-edit="'+esc(x.key)+'">改规格</button>'+
        '<div class="p">'+(x.price?("¥"+money(x.price*x.qty)):"—")+'</div></div>';
    }).join("");
    s.innerHTML =
      '<div class="sh"><b>确认订单</b><button id="shclose">关闭</button></div>'+
      '<div style="margin-top:4px">'+rows+'</div>'+
      '<div class="cknote"><input id="cknote" type="text" placeholder="备注：少甜、不要吸管…（可不填）" maxlength="60"></div>'+
      '<div class="cktot"><div class="l">共 '+cartCount()+' 件 · 到店自取<br>整单热量 '+r1(cartKcal())+' 大卡</div>'+
        '<div class="r"><b>'+(cartTotal()?money(cartTotal()):"—")+'</b><em>元</em></div></div>'+
      '<button class="cksub" id="cksub">提交订单</button>'+
      '<div class="specnote" style="margin-top:12px">提交后生成取餐号，制作状态在「我的」里随时可查。本 Demo 不含在线支付，到店付款。</div>';
    Array.prototype.forEach.call(s.querySelectorAll("[data-edit]"),function(b){
      b.addEventListener("click",function(){
        var key=b.dataset.edit;
        var it=state.cart.filter(function(x){ return x.key===key; })[0];
        if(!it) return;
        closeSheet();
        setTimeout(function(){ openQuick(it.pid, key); },60);
      });
    });
    document.getElementById("shclose").addEventListener("click",closeSheet);
    m.addEventListener("click",closeSheet);
    document.getElementById("cksub").addEventListener("click",submitOrder);
  }

  function specLine(x){
    var a=[];
    if(x.milk){ var mi=ing(x.milk); if(mi) a.push(mi.name); }
    if(x.sugar) a.push(x.sugar);
    if(x.ice) a.push(x.ice);
    a.push("中杯");
    return a.join(" · ");
  }

  async function submitOrder(){
    if(!state.cart.length) return;
    var btn=document.getElementById("cksub");
    if(btn){ btn.disabled=true; btn.textContent="提交中…"; }
    var noteEl=document.getElementById("cknote");
    var note=noteEl?noteEl.value.trim():"";
    var now=new Date(), prefix="A"+pad2(now.getMonth()+1)+pad2(now.getDate())+"-";
    var items=state.cart.map(function(x){
      return {pid:x.pid,name:x.name,qty:x.qty,price:x.price,kcal:x.kcal,milk:x.milk,sugar:x.sugar,ice:x.ice};
    });
    var payload={order_no:"", visitor_id:visitorId(), items:items,
      total:Math.round(cartTotal()*100)/100, total_kcal:Math.round(cartKcal()*10)/10,
      pickup:"到店自取", note:note, status:"待制作", created_at:new Date().toISOString()};

    var seq=1;
    if(supaReady()){
      try{
        var r=await sb.from('orders').select('order_no').like('order_no',prefix+'%');
        if(!r.error) seq=nextSeq(r.data,prefix);
      }catch(e){}
    }else{
      seq=nextSeq(readLS(ORD_KEY,[]),prefix);
    }

    var saved=false;
    if(supaReady()){
      for(var attempt=0; attempt<3; attempt++){
        payload.order_no=prefix+pad3(seq);
        try{
          var ins=await sb.from('orders').insert(payload);
          if(!ins.error){ saved=true; break; }
          if(ins.error && ins.error.code==="23505"){ seq++; continue; }
          console.error("insert order failed",ins.error); break;
        }catch(e){ console.error("insert order failed",e); break; }
      }
    }else{
      payload.order_no=prefix+pad3(seq);
    }
    if(!saved){
      var lo=readLS(ORD_KEY,[]); lo.unshift(payload); writeLS(ORD_KEY,lo);
    }

    state.cart=[]; saveCart(); state.qty={}; state.sheet=false;
    document.getElementById("mask").classList.remove("on");
    var sh=document.getElementById("sheet"); sh.classList.remove("on"); sh.innerHTML="";
    state.viewOrder=payload;
    if(!saved) toast("订单已记在这台设备上");
    render();
    loadOrders();
  }

  async function loadOrders(){
    var vid=visitorId();
    if(supaReady()){
      try{
        var r=await sb.from('orders').select('*').eq('visitor_id',vid).order('created_at',{ascending:false}).limit(20);
        if(!r.error && r.data){ state.orders=r.data; return; }
      }catch(e){}
    }
    state.orders=readLS(ORD_KEY,[]).slice(0,20);
  }

  function renderOrder(){
    var o=state.viewOrder;
    if(!o){ render(); return; }
    var cb=document.getElementById("cartbar"); if(cb) cb.innerHTML="";
    var steps=["待制作","制作中","已取餐"];
    var idx=steps.indexOf(o.status); if(idx<0) idx=0;
    var stepHtml=steps.map(function(s,i){
      var cls = i<idx?"on step":(i===idx?"on step now":"step");
      var hint = i===0?"商家已接单":(i===1?"正在制作":"叫号取餐");
      return '<div class="'+cls+'"><i></i><b>'+s+'</b><em>'+hint+'</em></div>';
    }).join("");
    var items=(o.items||[]).map(function(x){
      return '<div class="ckerow"><div><div class="n">'+esc(x.name)+' × '+x.qty+'</div>'+
        '<div class="s">'+esc(specLine(x))+'</div></div><div class="p">'+(x.price?("¥"+money(x.price*x.qty)):"—")+'</div></div>';
    }).join("");

    app.innerHTML =
      '<div class="page" style="padding-bottom:60px">'+
        '<div class="ordhead"><div class="l">取餐号 · ORDER</div>'+
          '<div class="ordno">'+esc(o.order_no||"—")+'<small>'+(o.total?"¥"+money(o.total):"")+'</small></div></div>'+
        '<div class="steps">'+stepHtml+'</div>'+
        '<div class="blk"><div class="lb"><b>本单清单</b><span>整单 '+(o.total_kcal||0)+' 大卡</span></div>'+items+
          (o.note?'<div class="specnote">备注：'+esc(o.note)+'</div>':"")+'</div>'+
        '<div class="foot" style="margin:22px 0 0">到店自取，柜台叫号。状态每 6 秒自动刷新，也可以回「我的」里再查。</div>'+
        '<div style="display:flex;gap:10px;margin-top:22px">'+
          '<button style="flex:1;background:none;border:1px solid var(--line);padding:12px 0;font:inherit;font-size:11px;letter-spacing:.12em;cursor:pointer" id="ordback">再点一单</button>'+
          '<button style="flex:1;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 0;font:inherit;font-size:11px;letter-spacing:.12em;cursor:pointer" id="ordme">我的订单</button>'+
        '</div>'+
      '</div>';

    document.getElementById("ordback").addEventListener("click",function(){ state.viewOrder=null; state.tab="menu"; render(); });
    document.getElementById("ordme").addEventListener("click",function(){ state.viewOrder=null; state.tab="me"; state.mePage=null; render(); });

    if(supaReady() && o.status!=="已取餐") pollOrder(o.order_no);
  }

  async function pollOrder(no){
    await new Promise(function(r){ setTimeout(r,6000); });
    if(!state.viewOrder || state.viewOrder.order_no!==no) return;
    try{
      var r=await sb.from("orders").select("status").eq("order_no",no).limit(1);
      if(!r.error && r.data && r.data[0] && r.data[0].status && r.data[0].status!==state.viewOrder.status){
        state.viewOrder.status=r.data[0].status; render();
      }
    }catch(e){}
  }

  var app=document.getElementById("app");
  function render(){
    renderTab();
    if(state.viewOrder){ renderOrder(); return; }
    if(state.selProduct){ renderDetail(); return; }
    if(state.tab==="menu") renderMenu();
    else if(state.tab==="me"){ state.mePage?renderMeSub():renderMe(); }
    else renderHome();
    renderCartBar();
  }

  async function boot(){
    app.innerHTML='<div class="page" style="padding-top:56px"><div class="foot">正在读取配料库…</div></div>';
    if(!supaReady()){ db=defaultData(); render(); return; }
    try{
      sb = supabase.createClient(SUPA_CONFIG.url, SUPA_CONFIG.anonKey);
      const res = await Promise.all([ sb.from('ingredients').select('*'), sb.from('products').select('*') ]);
      if(res[0].error) throw res[0].error;
      if(res[1].error) throw res[1].error;
      var ings=(res[0].data||[]).map(rowToIng), prods=(res[1].data||[]).map(rowToProduct);
      db=(ings.length||prods.length)?{ings:ings,products:prods}:defaultData();
    }catch(e){
      db=defaultData();
    }
    if(db.products.length && !byId(db.products,state.selId)) state.selId=db.products[0].id;
    render();
    loadOrders().then(function(){ if(state.tab==="me" && !state.mePage && !state.viewOrder) render(); });
  }
  boot();
})();
</script>
</body>
</html>
